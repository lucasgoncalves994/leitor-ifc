function semearApontamentos() {
  if (MODELO.chave !== 'piscina') return;   // a lista é da verificação do modelo da piscina
  let feito = '';
  try { feito = localStorage.getItem(APONT_SEED_KEY) || ''; } catch (err) { return; }
  if (feito === APONT_SEED_VERSAO) return;
  const data = new Date().toISOString();
  APONT_SEED.forEach(([guid, texto], k) => {
    const id = 'auto-' + APONT_SEED_VERSAO + '-' + k;
    const lista = (apontamentos[guid] = apontamentos[guid] || []);
    if (lista.some(a => a.id === id)) return;
    lista.push({ id, texto: '[verificação das ligações] ' + texto, data, resolvido: false });
  });
  salvarApontamentos();
  try { localStorage.setItem(APONT_SEED_KEY, APONT_SEED_VERSAO); } catch (err) { }
}
semearApontamentos();

const apontDe = (e) => apontamentos[e.guid] || [];
const abertosDe = (e) => apontDe(e).filter(a => !a.resolvido).length;
const totalApont = () => Object.values(apontamentos).reduce((t, l) => t + l.length, 0);

function rotuloAbaApont() {
  const aba = document.querySelector('.tab[data-pane="apontamentos"]');
  if (aba) aba.textContent = 'Apontamentos' + (totalApont() ? ' (' + totalApont() + ')' : '');
}

function atualizarAposApontamento() {
  salvarApontamentos();
  rotuloAbaApont();
  painelElemento();
  if (S.pane === 'apontamentos') renderApontamentos();
  else if (S.pane === 'elementos') renderCorpoElementos();
}

function novoApontamento(e, texto) {
  texto = texto.trim();
  if (!texto) return false;
  (apontamentos[e.guid] = apontamentos[e.guid] || []).push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    texto, data: new Date().toISOString(), resolvido: false
  });
  atualizarAposApontamento();
  return true;
}

const dataBr = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); };

function secaoApontamentos(e) {
  const box = el('details', 'pset'); box.style.marginTop = '10px';
  const lista = apontDe(e), ab = abertosDe(e);
  box.appendChild(el('summary', null, 'Apontamentos' + (lista.length ? ' (' + ab + ' pendente' + (ab === 1 ? '' : 's') + ' de ' + lista.length + ')' : '')));
  if (lista.length) box.open = true;

  for (const a of lista) {
    const li = el('div'); li.style.cssText = 'border-top:1px solid var(--line-soft);padding:7px 0;display:flex;gap:8px;align-items:flex-start';
    const ck = el('input'); ck.type = 'checkbox'; ck.checked = !!a.resolvido; ck.title = 'Marcar como concluído';
    ck.style.marginTop = '3px';
    ck.onchange = () => { a.resolvido = ck.checked; atualizarAposApontamento(); };
    const corpo = el('div'); corpo.style.cssText = 'flex:1 1 auto;min-width:0';
    const tx = el('div', null, a.texto);
    tx.style.cssText = 'font-size:12px;white-space:pre-wrap;word-break:break-word' + (a.resolvido ? ';text-decoration:line-through;color:var(--text-faint)' : '');
    const dt = el('div', null, dataBr(a.data) + (a.resolvido ? ' · concluído' : ''));
    dt.style.cssText = 'font-size:10.5px;color:var(--text-faint);margin-top:2px';
    corpo.appendChild(tx); corpo.appendChild(dt);
    const del = el('button', 'fechar', '×'); del.title = 'Excluir este apontamento';
    del.onclick = () => {
      apontamentos[e.guid] = lista.filter(x => x !== a);
      if (!apontamentos[e.guid].length) delete apontamentos[e.guid];
      atualizarAposApontamento();
    };
    li.appendChild(ck); li.appendChild(corpo); li.appendChild(del);
    box.appendChild(li);
  }

  const dica = el('div', null, 'Para criar um apontamento, clique com o botão direito na peça no visor.');
  dica.style.cssText = 'font-size:11px;color:var(--text-faint);margin-top:8px;line-height:1.45';
  box.appendChild(dica);
  return box;
}

/* Criar: botão direito (parado, sem arrastar) sobre a peça no visor abre uma caixa
   junto ao cursor. Arrastar com o direito continua deslocando a câmera. */
function fecharPopupApontamento() {
  const p = document.getElementById('popupApont');
  if (p) p.remove();
}

function abrirPopupApontamento(ev) {
  fecharPopupApontamento();
  const i = pecaSobCursor(ev);
  if (i < 0) return;
  const e = S.model.elements[i];
  selecionar(i, false);                       // mostra qual peça vai receber o apontamento, sem mexer na câmera

  const stage = $('#stage'), sr = stage.getBoundingClientRect();
  const box = el('div'); box.id = 'popupApont'; box.className = 'apopup';
  const ab = abertosDe(e);
  box.appendChild(el('div', 'ptit', 'Novo apontamento'));
  box.appendChild(el('div', 'psub', (nomeEl(e) || e.categoria) + (e.dn ? ' · DN ' + e.dn : '') + ' · ' + e.sistemaClasse +
    (ab ? ' · ' + ab + (ab === 1 ? ' aberto' : ' abertos') : '')));
  const ta = el('textarea'); ta.rows = 3; ta.placeholder = 'Escreva o apontamento…';
  const acoes = el('div', 'row'); acoes.style.marginTop = '7px';
  const ok = el('button', 'btn pri', 'Salvar'); const nao = el('button', 'btn', 'Cancelar');
  ok.onclick = () => { if (novoApontamento(e, ta.value)) fecharPopupApontamento(); else ta.focus(); };
  nao.onclick = fecharPopupApontamento;
  ta.onkeydown = (k) => {
    k.stopPropagation();
    if (k.key === 'Escape') { k.preventDefault(); fecharPopupApontamento(); }
    else if (k.key === 'Enter' && (k.ctrlKey || k.metaKey)) { k.preventDefault(); ok.click(); }
  };
  acoes.appendChild(ok); acoes.appendChild(nao);
  box.appendChild(ta); box.appendChild(acoes);
  box.appendChild(el('div', 'pdica', 'Ctrl+Enter salva · Esc cancela'));
  stage.appendChild(box);

  // junto ao cursor, sem sair do visor
  const w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(6, Math.min(sr.width - w - 6, ev.clientX - sr.left + 8)) + 'px';
  box.style.top = Math.max(6, Math.min(sr.height - h - 6, ev.clientY - sr.top + 8)) + 'px';
  ta.focus();
}

function renderApontamentos() {
  const p = $('#pane-apontamentos'); p.innerHTML = '';
  const porGuid = new Map(S.model.elements.map(e => [e.guid, e]));
  const todos = [];
  for (const g of Object.keys(apontamentos)) for (const a of apontamentos[g]) todos.push({ g, a, e: porGuid.get(g) });
  todos.sort((x, y) => (x.a.data < y.a.data ? 1 : -1));

  const barra = el('div'); barra.style.cssText = 'display:flex;gap:9px;align-items:center;margin-bottom:9px;flex-wrap:wrap';
  const sel = el('select');
  for (const [v, t] of [['todos', 'Todos'], ['abertos', 'Só pendentes'], ['resolvidos', 'Só concluídos']]) sel.appendChild(Object.assign(el('option'), { value: v, textContent: t }));
  sel.value = S.filtroApont || 'todos';
  sel.onchange = () => { S.filtroApont = sel.value; renderApontamentos(); };
  // pendentes primeiro, concluídos depois (cada grupo do mais recente para o mais antigo)
  const lista = todos.filter(x => (S.filtroApont === 'abertos' ? !x.a.resolvido : S.filtroApont === 'resolvidos' ? x.a.resolvido : true));
  const pendentes = lista.filter(x => !x.a.resolvido), feitos = lista.filter(x => x.a.resolvido);
  const exp = el('button', 'btn', 'Exportar CSV');
  exp.onclick = () => exportarApontamentos(pendentes.concat(feitos));
  barra.appendChild(sel); barra.appendChild(exp);
  barra.appendChild(el('span', 'chip', pendentes.length + ' pendente' + (pendentes.length === 1 ? '' : 's')));
  barra.appendChild(el('span', 'chip', feitos.length + ' concluído' + (feitos.length === 1 ? '' : 's')));
  p.appendChild(barra);

  if (!todos.length) {
    p.appendChild(Object.assign(el('p', 'empty'), { innerHTML: 'Nenhum apontamento ainda. Selecione uma peça e use <b>Apontamentos</b> no painel de propriedades.' }));
    tabelaAtual = [];
    return;
  }
  const linha = ({ a, e }) => ({
    _el: e ? e.i : null,
    _cls: a.resolvido ? 'feito' : null,
    c: [a.resolvido ? '✓ concluído' : '● pendente', e ? (nomeEl(e) || e.categoria) : '(peça não está neste modelo)',
      e ? e.sistemaClasse : '', e ? pill(e.dn) : '', a.texto, dataBr(a.data), e ? e.tag : '']
  });
  const linhas = [];
  // as faixas só aparecem quando o filtro deixa os dois grupos na tela
  const comFaixa = pendentes.length && feitos.length;
  if (pendentes.length) {
    if (comFaixa) linhas.push({ _grupo: 'Pendentes (' + pendentes.length + ')' });
    for (const x of pendentes) linhas.push(linha(x));
  }
  if (feitos.length) {
    if (comFaixa) linhas.push({ _grupo: 'Concluídos (' + feitos.length + ')' });
    for (const x of feitos) linhas.push(linha(x));
  }
  p.appendChild(tabela([{ t: 'Status' }, { t: 'Peça' }, { t: 'Sistema' }, { t: 'Diâmetro' }, { t: 'Apontamento' },
    { t: 'Data' }, { t: 'ID no Revit', n: 1 }], linhas));
  marcarLinha();
}

function exportarApontamentos(lista) {
  const esc = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const linhas = [['Status', 'Peça', 'Sistema', 'Diâmetro (mm)', 'Apontamento', 'Data', 'ID no Revit', 'GUID']];
  for (const { g, a, e } of lista)
    linhas.push([a.resolvido ? 'concluído' : 'pendente', e ? (nomeEl(e) || e.categoria) : '', e ? e.sistemaClasse : '',
      e && e.dn ? e.dn : '', a.texto, dataBr(a.data), e ? e.tag : '', g]);
  const csv = '﻿' + linhas.map(l => l.map(esc).join(';')).join('\r\n');   // BOM + ";" abrem certo no Excel em português
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = el('a'); a.href = url; a.download = 'apontamentos-piscina.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function detalheElemento(p, e, compacto) {
  const kps = el('div', 'keyparams');

  // 1. diâmetro
  const kp1 = el('div', 'kp dn');
  kp1.appendChild(el('div', 'k', 'Diâmetro'));
  let dnTxt = '—';
  if (e.dnPortas.length > 1) dnTxt = e.dnPortas.map(d => d + ' mm').join(' × ');
  else if (e.dn) dnTxt = e.dn + ' mm';
  else if (e.largura) dnTxt = fmt(e.largura, 0) + ' × ' + fmt(e.altura, 0) + ' mm';
  kp1.appendChild(el('div', 'v', dnTxt));
  let origem = e.dnFonte ? 'origem: ' + (e.dnFonte === 'manual' ? 'editado por você' : FONTE_DN[e.dnFonte]) : 'o IFC não traz diâmetro para esta peça';
  if (e.dnParam) origem += ' "' + e.dnParam + '"';
  if (e.dnFonte === 'pset' && e.dnGeom) origem += e.dnGeom === e.dn ? ' · confere com a geometria' : ' · a geometria dá ' + e.dnGeom + ' mm';
  kp1.appendChild(el('div', 'src', origem));
  kps.appendChild(kp1);

  if (!compacto) {
    // 2. tipo de tubo
    const kp2 = el('div', 'kp tp');
    kp2.appendChild(el('div', 'k', 'Tipo'));
    kp2.appendChild(el('div', 'v', nomeEl(e) || '—'));
    kp2.appendChild(el('div', 'src', e.nomeEd ? 'nome editado · original: ' + (e.tipo || e.familia || '—') : (e.familia ? 'família: ' + e.familia : '')));
    kps.appendChild(kp2);

    // 3. sistema
    const kp3 = el('div', 'kp sys');
    kp3.appendChild(el('div', 'k', 'Sistema'));
    kp3.appendChild(el('div', 'v', e.sistemaClasse));
    kp3.appendChild(el('div', 'src', e.sistemas.length ? e.sistemas.join(' · ') : 'não atribuído a nenhum IfcSystem'));
    kps.appendChild(kp3);
  }
  p.appendChild(kps);

  const dl = el('dl', 'props');
  if (compacto) linhaProp(dl, 'Sistema', e.sistema || e.sistemaClasse);
  linhaProp(dl, 'Categoria', e.categoria);
  if (!compacto) linhaProp(dl, 'Classe IFC', e.ifcType);
  if (ehLinear(e) && e.comprimento) linhaProp(dl, 'Comprimento', fmt(e.comprimento, 3) + ' m');
  if (e.parede) linhaProp(dl, 'Parede', fmt(e.parede, 1) + ' mm');
  linhaProp(dl, 'Pavimento', e.pavimento);
  if (!compacto) {
    linhaProp(dl, 'Material', e.material);
    linhaProp(dl, 'Fabricante', e.fabricante);
    linhaProp(dl, 'Perfil', e.perfil);
  }
  linhaProp(dl, 'ID no Revit', e.tag);
  if (!compacto) {
    // parâmetros do Revit exportados no IFC (R01 em diante); somem sozinhos quando não existem
    linhaProp(dl, 'Marca', e.marca);
    linhaProp(dl, 'Comentários', e.comentarios);
    linhaProp(dl, 'Nome do sistema', e.nomeSistema);
    linhaProp(dl, 'Material do sistema', e.materialSistema);
    linhaProp(dl, 'Descrição', e.descricao);
    if (e.vazaoLs != null) linhaProp(dl, 'Vazão', fmt(e.vazaoLs, 2) + ' L/s · ' + fmt(e.vazaoLs * 3.6, 2) + ' m³/h');
    if (e.hmtPa != null) linhaProp(dl, 'Altura manométrica (HMT)', fmt(e.hmtPa / 9806.65, 2) + ' m.c.a. · ' + fmt(e.hmtPa / 1000, 1) + ' kPa (valor do IFC em Pa, presumido)');
    linhaProp(dl, 'GUID', e.guid);
  }
  p.appendChild(dl);

  if (!compacto) {
    const nomes = Object.keys(e.props).sort();
    if (nomes.length) {
      const d = el('details', 'pset');
      d.appendChild(el('summary', null, 'Propriedades do IFC (' + nomes.length + ' conjuntos)'));
      for (const nome of nomes) {
        const bag = e.props[nome];
        const chaves = Object.keys(bag);
        if (!chaves.length) continue;
        d.appendChild(el('div', null, nome)).style.cssText = 'font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-top:7px';
        const dd = el('dl', 'props');
        for (const k of chaves) linhaProp(dd, k, bag[k].value);
        d.appendChild(dd);
      }
      p.appendChild(d);
    }

    const acoes = el('div', 'row'); acoes.style.marginTop = '10px';
    const b1 = el('button', 'btn', 'Dar zoom na peça'); b1.onclick = () => enquadrar(e.i, true);
    const b2 = el('button', 'btn', 'Ocultar'); b2.onclick = () => { S.visivelEl[e.i] = 0; atualizarVisibilidade(); renderTabs(); };
    acoes.appendChild(b1); acoes.appendChild(b2);
    p.appendChild(acoes);
    p.appendChild(secaoApontamentos(e));
    p.appendChild(editorEdicao([e.i]));
  }
}

/* =========================================================
   8. Tabelas
   ========================================================= */
let tabelaAtual = [];       // para o botão copiar

/* Âncora do intervalo: a última linha clicada e a lista de linhas da tabela dela.
   Shift+clique seleciona tudo entre a âncora e a linha clicada (como no Explorer);
   a âncora não muda, então outro Shift+clique refaz o intervalo a partir dela. */
let ancoraTabela = null;    // { itens, pos }

function cliqueLinha(ev, itens, pos, clicar) {
  if (ev.shiftKey && ancoraTabela && ancoraTabela.itens === itens) {
    const de = Math.min(ancoraTabela.pos, pos), ate = Math.max(ancoraTabela.pos, pos);
    const ids = new Set(), chaves = new Set();
    for (let k = de; k <= ate; k++) {
      for (const i of itens[k].ids) ids.add(i);
      if (itens[k].chave) chaves.add(itens[k].chave);
    }
    selecionarIntervalo([...ids], chaves);
    return;
  }
  ancoraTabela = { itens, pos };
  if (ev.ctrlKey || ev.metaKey || ev.shiftKey) alternarNaSelecao(itens[pos].ids.slice());  // sem âncora: soma
  else clicar();
}

function selecionarIntervalo(ids, chaves) {
  const visiveis = ids.filter(i => elementoVisivel(i));
  const usar = visiveis.length ? visiveis : ids;
  S.conj = { rotulo: 'Seleção por intervalo', ids: usar, i: -1, chave: null, chaves };
  S.sel = -1;
  painelElemento(); atualizarDestaque(); marcarLinha();
  enquadrar(usar, true);
}

function tabela(colunas, linhas, opts) {
  opts = opts || {};
  const t = el('table');
  const thead = el('thead'), tr = el('tr');
  for (const c of colunas) {
    const th = el('th', c.n ? 'n' : null, c.t);
    tr.appendChild(th);
  }
  thead.appendChild(tr); t.appendChild(thead);
  const tb = el('tbody');
  const itens = [];           // linhas selecionáveis desta tabela, na ordem em que aparecem
  for (const L of linhas) {
    if (L._grupo) {                        // faixa que separa grupos (ex.: pendentes x concluidos)
      const rg = el('tr', 'grupo'), tdg = el('td', null, L._grupo);
      tdg.colSpan = colunas.length; rg.appendChild(tdg); tb.appendChild(rg);
      continue;
    }
    const r = el('tr');
    if (L._tot) r.className = 'tot';
    if (L._cls) r.className = (r.className + ' ' + L._cls).trim();
    if (L._el != null) {
      const pos = itens.length;
      itens.push({ ids: [L._el], chave: null });
      r.className = (r.className + ' clickable').trim();
      r.dataset.el = L._el;
      r.title = 'Clique para ver a peça. Shift+clique seleciona o intervalo até a última linha clicada; Ctrl+clique soma ou tira uma linha.';
      r.onclick = (ev) => cliqueLinha(ev, itens, pos, () => selecionar(L._el, true));
    } else if (L._els && L._els.length) {
      const pos = itens.length;
      itens.push({ ids: L._els, chave: L._chave });
      r.className = (r.className + ' clickable').trim();
      r.dataset.conj = L._chave;
      r.title = 'Clique para destacar as ' + L._els.length + ' peças no 3D. Shift+clique seleciona o intervalo até a última linha clicada; Ctrl+clique soma ou tira uma linha.';
      r.onclick = (ev) => cliqueLinha(ev, itens, pos, () => selecionarConjunto(L._rotulo, L._els.slice(), L._chave));
    }
    colunas.forEach((c, i) => {
      const td = el('td', c.n ? 'n' : null);
      const v = L.c[i];
      if (v && v.html) td.innerHTML = v.html; else td.textContent = v == null ? '' : v;
      r.appendChild(td);
    });
    tb.appendChild(r);
  }
  t.appendChild(tb);
  tabelaAtual = [colunas.map(c => c.t)].concat(linhas.filter(L => L.c).map(L => L.c.map(v => (v && v.txt !== undefined) ? v.txt : (v == null ? '' : String(v)))));
  return t;
}

function pill(dn) {
  if (!dn) return { html: '<span class="dnpill" style="color:' + COR_SEM + ';border-color:' + COR_SEM + '">—</span>', txt: '' };
  const g = S.modo === 'diametro' ? S.grupos.find(x => x.chave === 'DN ' + dn) : null;
  const cor = g ? g.cor : RAMPA_DN[Math.max(0, S.model.diametros.indexOf(dn)) % RAMPA_DN.length];
  return { html: '<span class="dnpill" style="color:' + cor + ';border-color:' + cor + '">DN ' + dn + '</span>', txt: 'DN ' + dn };
}

function renderTabs() {
  const visFiltro = (e) => elementoVisivel(e.i);
  const Q = quantitativos(S.model, visFiltro);
  renderResumo(Q);
  renderSistemas(Q);
  renderPecas(Q);
  renderPecasSistema(Q);
  renderElementos();
  rotuloAbaApont();
  mostrarPane(S.pane);
}

function renderResumo(Q) {
  const p = $('#pane-resumo'); p.innerHTML = '';
  const M = S.model;
  const nTubos = M.elements.filter(e => elementoVisivel(e.i) && ehLinear(e)).length;
  const nCon = M.elements.filter(e => elementoVisivel(e.i) && e.categoria === 'Conexão').length;
  const nSis = new Set(M.elements.filter(e => elementoVisivel(e.i)).map(e => e.sistemaClasse)).size;

  const tiles = el('div', 'tiles');
  const addTile = (t, n, u) => {
    const d = el('div', 'tile');
    d.appendChild(el('div', 't', t));
    const nn = el('div', 'n'); nn.textContent = n;
    if (u) { const s = el('span', 'u', ' ' + u); nn.appendChild(s); }
    d.appendChild(nn); tiles.appendChild(d);
  };
  addTile('Tubo', fmt(Q.totalM, 2), 'm');
  addTile('Trechos de tubo', nTubos);
  addTile('Conexões', nCon);
  addTile('Sistemas', nSis);
  addTile('Elementos à vista', Q.nElementos);
  p.appendChild(tiles);

  p.appendChild(Object.assign(el('p', 'tablehint'),
    { textContent: 'Clique numa linha para destacar esses tubos no 3D. Comprimentos medidos na geometria do IFC (extrusão de cada trecho) e conferidos contra a propriedade Length do arquivo. Os números acompanham o que está visível no visor.' }));

  const trechosDN = new Map();
  for (const e of S.model.elements)
    if (elementoVisivel(e.i) && ehLinear(e)) trechosDN.set(e.dn || 0, (trechosDN.get(e.dn || 0) || 0) + 1);
  const linhas = Q.porDN.map(r => ({
    _els: r.ids, _chave: 'dn:' + r.dn, _rotulo: 'Tubo DN ' + r.dn,
    c: [pill(r.dn), fmt(r.m, 2), trechosDN.get(r.dn) || 0]
  }));
  linhas.push({ _tot: 1, c: [{ html: 'Total', txt: 'Total' }, fmt(Q.totalM, 2), nTubos] });
  p.appendChild(tabela([{ t: 'Diâmetro' }, { t: 'Comprimento (m)', n: 1 }, { t: 'Trechos', n: 1 }], linhas));
}

function ehLinear(e) { return e.categoria === 'Tubo' || e.categoria === 'Eletroduto / calha' || e.categoria === 'Duto'; }

function renderSistemas(Q) {
  const p = $('#pane-sistemas'); p.innerHTML = '';
  p.appendChild(Object.assign(el('p', 'tablehint'),
    { textContent: 'Clique numa linha para destacar esses trechos no 3D. O sistema vem do IfcSystem a que o Revit vinculou cada trecho; a bitola, do perfil circular da geometria.' }));
  const linhas = Q.porSistemaDN.map(r => ({
    _els: r.ids, _chave: 'sis:' + r.sistema + ':' + r.dn,
    _rotulo: r.sistema + ' · DN ' + r.dn,
    c: [r.sistema, pill(r.dn), r.tipo, fmt(r.m, 2), r.n]
  }));
  linhas.push({ _tot: 1, c: ['Total', '', '', fmt(Q.totalM, 2), Q.porSistemaDN.reduce((s, r) => s + r.n, 0)] });
  p.appendChild(tabela([{ t: 'Sistema' }, { t: 'Diâmetro' }, { t: 'Tipo de tubo' }, { t: 'Comprimento (m)', n: 1 }, { t: 'Trechos', n: 1 }], linhas));
}

function renderPecas(Q) {
  const p = $('#pane-pecas'); p.innerHTML = '';
  const comDesc = Q.pecas.some(r => r.descricao);        // só o IFC com "Descrição do Material"
  p.appendChild(Object.assign(el('p', 'tablehint'),
    { textContent: 'Clique numa linha para destacar essas peças no 3D e percorrê-las uma a uma. A bitola vem do parâmetro "Tamanho" do IFC quando existe; ' +
      'senão, dos diâmetros dos tubos ligados às portas da peça (por isso reduções e tês aparecem com duas ou três medidas).' +
      (comDesc ? ' A descrição é a "Descrição do Material" do Revit.' : '') }));
  const linhas = Q.pecas.map(r => ({
    _els: r.ids, _chave: 'pc:' + r.objType + ':' + r.bitola + ':' + r.descricao,
    _rotulo: (r.descricao || r.tipo) + ' · ' + (r.bitola === '—' ? 'sem bitola' : r.bitola + ' mm'),
    c: [r.categoria, r.familia, r.tipo, r.bitola].concat(comDesc ? [r.descricao] : [], [r.n])
  }));
  linhas.push({ _tot: 1, c: ['Total', '', '', ''].concat(comDesc ? [''] : [], [Q.pecas.reduce((s, r) => s + r.n, 0)]) });
  p.appendChild(tabela([{ t: 'Categoria' }, { t: 'Família' }, { t: 'Tipo' }, { t: 'Bitola (mm)' }]
    .concat(comDesc ? [{ t: 'Descrição' }] : [], [{ t: 'Quantidade', n: 1 }]), linhas));
}

function renderPecasSistema(Q) {
  const p = $('#pane-pecas-sistema'); p.innerHTML = '';
  p.appendChild(Object.assign(el('p', 'tablehint'),
    { textContent: 'As mesmas conexões, registros e dispositivos da aba anterior, separados pela rede a que o IFC os vincula. ' +
      'Cada rede fecha com o seu subtotal. Clique numa linha para destacar as peças no 3D; Shift+clique soma à seleção.' }));

  const comDesc = Q.pecasPorSistema.some(r => r.descricao);
  const extra = comDesc ? [''] : [];
  const linhas = [];
  let sistemaAtual = null, subtotal = 0;
  const fechaBloco = () => {
    if (sistemaAtual !== null)
      linhas.push({ _tot: 1, c: ['Subtotal · ' + sistemaAtual, '', '', ''].concat(extra, [subtotal]) });
  };
  for (const r of Q.pecasPorSistema) {
    if (r.sistema !== sistemaAtual) { fechaBloco(); sistemaAtual = r.sistema; subtotal = 0; }
    subtotal += r.n;
    linhas.push({
      _els: r.ids, _chave: 'ps:' + r.sistema + ':' + r.objType + ':' + r.bitola + ':' + r.descricao,
      _rotulo: (r.descricao || r.tipo) + ' · ' + (r.bitola === '—' ? 'sem bitola' : r.bitola + ' mm') + ' · ' + r.sistema,
      c: [r.sistema, r.categoria, r.tipo, r.bitola].concat(comDesc ? [r.descricao] : [], [r.n])
    });
  }
  fechaBloco();
  const total = Q.pecasPorSistema.reduce((s, r) => s + r.n, 0);
  linhas.push({ _tot: 1, c: ['Total geral', '', '', ''].concat(extra, [total]) });

  p.appendChild(tabela([{ t: 'Sistema' }, { t: 'Categoria' }, { t: 'Tipo' }, { t: 'Bitola (mm)' }]
    .concat(comDesc ? [{ t: 'Descrição' }] : [], [{ t: 'Quantidade', n: 1 }]), linhas));
}

function renderElementos() {
  const p = $('#pane-elementos');
  p.innerHTML = '';
  const barra = el('div');
  barra.style.cssText = 'display:flex;gap:9px;align-items:center;margin-bottom:9px;flex-wrap:wrap';
  const busca = el('input');
  busca.type = 'search';
  busca.id = 'buscaEl';
  busca.placeholder = 'Filtrar por tipo, sistema, DN, ID do Revit…';
  busca.value = S.busca;
  busca.style.maxWidth = '340px';
  busca.oninput = () => { S.busca = busca.value; renderCorpoElementos(); };
  barra.appendChild(busca);
  barra.appendChild(el('span', 'chip', '')).id = 'elCount';
  p.appendChild(barra);
  p.appendChild(el('div')).id = 'elTable';
  renderCorpoElementos();
}

function renderCorpoElementos() {
  const alvo = $('#elTable');
  if (!alvo) { renderElementos(); return; }
  const q = S.busca.trim().toLowerCase();
  const els = S.model.elements.filter(e => {
    if (!elementoVisivel(e.i)) return false;
    if (!q) return true;
    return (e.objType + ' ' + (e.nomeEd || '') + ' ' + e.sistemaClasse + ' ' + e.categoria + ' ' + e.tag +
      ' DN' + e.dn + ' ' + e.dn + ' ' + e.pavimento + ' ' + e.material + ' ' + e.fabricante + ' ' +
      (e.marca || '') + ' ' + (e.comentarios || '') + ' ' + (e.nomeSistema || '') + ' ' + (e.descricao || ''))
      .toLowerCase().includes(q);
  });
  const corte = els.slice(0, 600);
  const cnt = $('#elCount');
  if (cnt) cnt.textContent = els.length + ' elementos' + (els.length > 600 ? ' — mostrando os 600 primeiros' : '');
  const comMarca = S.model.elements.some(e => e.marca);   // só o IFC com "Marca" (Revit)
  const linhas = corte.map(e => ({
    _el: e.i,
    c: [e.categoria, (e.editado ? '✎ ' : '') + (abertosDe(e) ? '💬' + abertosDe(e) + ' ' : '') + (nomeEl(e) || ''), pill(e.dn), e.sistemaClasse]
      .concat(comMarca ? [e.marca || ''] : [], [ehLinear(e) && e.comprimento ? fmt(e.comprimento, 3) : '', e.tag])
  }));
  alvo.innerHTML = '';
  alvo.appendChild(tabela([{ t: 'Categoria' }, { t: 'Tipo' }, { t: 'Diâmetro' }, { t: 'Sistema' }]
    .concat(comMarca ? [{ t: 'Marca' }] : [], [{ t: 'Comprimento (m)', n: 1 }, { t: 'ID no Revit', n: 1 }]), linhas));
  marcarLinha();
}

function marcarLinha() {
  const porIntervalo = S.conj && S.conj.chaves ? S.conj : null;
  const noIntervalo = porIntervalo ? new Set(porIntervalo.ids) : null;
  document.querySelectorAll('tbody tr[data-el]').forEach(tr => {
    tr.classList.toggle('sel', +tr.dataset.el === S.sel);
    tr.classList.toggle('conj', !!noIntervalo && noIntervalo.has(+tr.dataset.el));
  });
  document.querySelectorAll('tbody tr[data-conj]').forEach(tr => {
    tr.classList.toggle('conj', !!S.conj && (tr.dataset.conj === S.conj.chave ||
      (!!porIntervalo && porIntervalo.chaves.has(tr.dataset.conj))));
  });
}

function mostrarPane(id) {
  S.pane = id;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.pane === id));
  document.querySelectorAll('.tabpane').forEach(x => x.classList.toggle('on', x.id === 'pane-' + id));
  // o botão Copiar sempre leva a tabela da aba aberta
  const fn = { resumo: renderResumo, sistemas: renderSistemas, pecas: renderPecas, 'pecas-sistema': renderPecasSistema };
  if (fn[id]) fn[id](quantitativos(S.model, (e) => elementoVisivel(e.i)));
  else if (id === 'apontamentos') renderApontamentos();
  else renderCorpoElementos();
  marcarLinha();
}

function instalarAlca(id, aplicar) {
  const h = $(id);
  if (!h) return;
  let ativo = false;
  h.addEventListener('pointerdown', e => {
    ativo = true; h.setPointerCapture(e.pointerId); h.classList.add('ativa');
    e.preventDefault();
  });
  h.addEventListener('pointermove', e => { if (ativo) { aplicar(e); redimensionar(); } });
  const fim = () => { if (ativo) { ativo = false; h.classList.remove('ativa'); redimensionar(); } };
  h.addEventListener('pointerup', fim);
  h.addEventListener('pointercancel', fim);
}

function largura(painel, px, min, max, chave) {
  const v = Math.max(min, Math.min(max, px));
  painel.style.flexBasis = v + 'px';
  painel.style.width = v + 'px';
  guardar(chave, String(Math.round(v)));
}

  guardar('leitor-ifc-alt-gaveta', String(Math.round(alt)));
});

// restaura o que ficou guardado da última sessão
(function restaurarLayout() {
  const le = +ler('leitor-ifc-larg-esq');
  if (le) largura($('#painelEsq'), le, 150, 460, 'leitor-ifc-larg-esq');
  const ld = +ler('leitor-ifc-larg-dir');
  if (ld) largura($('#painelDir'), ld, 190, 560, 'leitor-ifc-larg-dir');
  const ag = +ler('leitor-ifc-alt-gaveta');
  if (ag) { const g = $('#gaveta'); g.style.height = ag + 'px'; g.style.maxHeight = 'none'; }
  painelDirAberto(ler('leitor-ifc-painel-dir') === '1', false);
  painelEsqAberto(ler('leitor-ifc-painel-esq') !== '0', false);   // aberto por padrão
})();

/* ---------- tema claro / escuro ---------- */
function modoTema() {
  try {
    const m = localStorage.getItem('leitor-ifc-tema');
    if (m === 'light' || m === 'dark') return m;
  } catch (e) { }
  return 'auto';
}

function definirTema(modo) {
  const r = document.documentElement;
  if (modo === 'auto') {
    // volta a seguir o tema de quem hospeda a página, ou o do sistema
    const host = r.dataset.temaHost;
    if (host) r.setAttribute('data-theme', host); else r.removeAttribute('data-theme');
    try { localStorage.removeItem('leitor-ifc-tema'); } catch (e) { }
  } else {
    r.setAttribute('data-theme', modo);
    try { localStorage.setItem('leitor-ifc-tema', modo); } catch (e) { }
  }
  const rot = { auto: 'automático', light: 'claro', dark: 'escuro' };
  const b = $('#temaBtn');
  if (b) b.textContent = 'Tema: ' + rot[modo];
  aplicarTema3D();
}

$('#temaBtn').onclick = () => {
  const ordem = ['auto', 'light', 'dark'];
  definirTema(ordem[(ordem.indexOf(modoTema()) + 1) % ordem.length]);
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (modoTema() === 'auto') aplicarTema3D();
});
definirTema(modoTema());

$('#openBtn').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  $('#loading').classList.remove('hidden');
  $('#lerr').classList.add('hidden');
  await progresso(0.02, 'Lendo ' + f.name);
  try {
    const buf = await f.arrayBuffer();
    const txt = new TextDecoder('utf-8').decode(buf);
    if (!/ISO-10303-21/i.test(txt.slice(0, 400))) throw new Error('Este arquivo não parece ser um IFC no formato STEP.');
    await montar(txt);
    $('#fileName').textContent = f.name;
  } catch (err) {
    $('#lerr').classList.remove('hidden');
    $('#lerr').textContent = err.message || String(err);
    $('#lmsg').textContent = 'Escolha outro arquivo:';
  }
};
$('#copyBtn').onclick = async () => {
  const txt = tabelaAtual.map(l => l.join('\t')).join('\n');
  const b = $('#copyBtn'), antes = b.textContent;
  try {
    await navigator.clipboard.writeText(txt);
    b.textContent = 'Copiado — cole no Excel';
  } catch (_) {
    b.textContent = 'O navegador bloqueou a cópia';
  }
  setTimeout(() => { b.textContent = antes; }, 2200);
};

iniciar();
</script>
