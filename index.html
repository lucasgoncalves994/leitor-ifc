<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor IFC da Piscina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
(function () {
  var r = document.documentElement;
  r.dataset.temaHost = r.getAttribute('data-theme') || '';
  var m = null;
  try { m = localStorage.getItem('leitor-ifc-tema'); } catch (e) { }
  if (m === 'light' || m === 'dark') r.setAttribute('data-theme', m);
})();
</script>
<style>
/* Prancha de projeto: painéis fixos nas laterais, visor 3D no centro,
   quantitativos numa gaveta inferior. Dois temas sobre os mesmos tokens. */
/* Paleta clara como base; a escura redefine os mesmos tokens. */
:root{
  color-scheme: light;
  --bg:#eef1f5;
  --surface:#ffffff;
  --surface-2:#f3f6f9;
  --surface-3:#e6ebf1;
  --line:#cdd6e0;
  --line-soft:#e1e7ee;
  --text:#16222f;
  --text-dim:#55677c;
  --text-faint:#7d8ea3;
  --accent:#1d6fc4;
  --accent-dim:#d4e6f8;
  --good:#17895e;
  --warn:#9a6508;
  --crit:#b3272c;
  --conj:#d35400;
  --sel-linha:#d4e6f8;
  --visor:#f4f6f9;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Helvetica,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f141b;
    --surface:#18202b;
    --surface-2:#1f2935;
    --surface-3:#273341;
    --line:#2f3d4d;
    --line-soft:#243040;
    --text:#e6edf5;
    --text-dim:#8fa0b4;
    --text-faint:#64748b;
    --accent:#49a0f0;
    --accent-dim:#2a4a69;
    --good:#3dc88d;
    --warn:#e0a141;
    --crit:#e35d61;
    --conj:#ff8a3d;
    --sel-linha:#2a4a69;
    --visor:#0b1016;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f141b;
  --surface:#18202b;
  --surface-2:#1f2935;
  --surface-3:#273341;
  --line:#2f3d4d;
  --line-soft:#243040;
  --text:#e6edf5;
  --text-dim:#8fa0b4;
  --text-faint:#64748b;
  --accent:#49a0f0;
  --accent-dim:#2a4a69;
  --good:#3dc88d;
  --warn:#e0a141;
  --crit:#e35d61;
  --conj:#ff8a3d;
  --sel-linha:#2a4a69;
  --visor:#0b1016;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--body);
  font-size:13px;line-height:1.45;overflow:hidden;
  display:flex;flex-direction:column;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- cabeçalho ---------- */
header{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:9px 16px;background:var(--surface);
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand h1{
  font-family:var(--display);font-size:15px;font-weight:700;margin:0;
  letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;
}
.brand .file{
  font-family:var(--mono);font-size:11px;color:var(--text-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;
}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;
  padding:3px 7px;border:1px solid var(--line);border-radius:3px;
  color:var(--text-dim);background:var(--surface-2);white-space:nowrap;
}
.btn{
  background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r);
  padding:5px 11px;cursor:pointer;font-weight:500;font-size:12px;
  display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s;
}
a.btn{color:inherit;text-decoration:none}
.btn:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn.pri{background:var(--accent-dim);border-color:var(--accent);color:var(--text)}
.btn.pri:hover{filter:brightness(1.08)}

/* ---------- corpo ---------- */
.body{flex:1 1 auto;display:flex;min-height:0}
aside{
  width:252px;flex:0 0 252px;background:var(--surface);
  border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;
}
aside.right{border-right:none;border-left:1px solid var(--line);width:296px;flex-basis:296px}
.sec{border-bottom:1px solid var(--line-soft);padding:12px 14px}
.sec h2{
  font-family:var(--display);font-size:10.5px;font-weight:700;margin:0 0 9px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);
}
.stage{flex:1 1 auto;position:relative;min-width:0;background:var(--visor)}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* seletor de coloração */
.modes{display:flex;flex-direction:column;gap:2px}
.mode{
  display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:var(--r);
  cursor:pointer;border:1px solid transparent;
}
.mode:hover{background:var(--surface-2)}
.mode.on{background:var(--accent-dim);border-color:var(--accent);color:var(--text)}
.mode input{accent-color:var(--accent);margin:0}

/* legenda */
.legend{display:flex;flex-direction:column;gap:1px;margin:0 -4px}
.lrow{
  display:grid;grid-template-columns:14px 1fr auto auto;align-items:center;gap:8px;
  padding:4px 5px;border-radius:4px;cursor:pointer;
}
.lrow:hover{background:var(--surface-2)}
.lrow.off{opacity:.33}
.sw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(128,128,128,.5)}
.lrow .nm{
  font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lrow .ct{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.lrow .iso{
  font-size:10px;color:var(--text-faint);border:1px solid var(--line);
  border-radius:3px;padding:1px 4px;visibility:hidden;background:var(--surface-3);
}
.lrow:hover .iso{visibility:visible}
.lrow .iso:hover{color:var(--accent);border-color:var(--accent-dim)}

/* alças de redimensionamento nas bordas do visor */
.rsz{flex:0 0 6px;background:var(--line-soft);cursor:col-resize;position:relative;transition:background .12s}
.rsz.h{flex:0 0 6px;width:100%;cursor:row-resize}
.rsz:hover,.rsz.ativa{background:var(--accent)}
.rsz::after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:2px;height:26px;border-radius:2px;background:var(--line);
}
.rsz.h::after{width:26px;height:2px}
.rsz:hover::after,.rsz.ativa::after{background:var(--surface)}

/* aba para reabrir o painel de propriedades */
.aba{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;background:var(--surface);
  border:1px solid var(--line);border-right:none;border-radius:var(--r) 0 0 var(--r);
  padding:14px 5px;cursor:pointer;font-family:var(--display);font-size:11px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim);
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}
.aba.esq{right:auto;left:0;border:1px solid var(--line);border-left:none;border-radius:0 var(--r) var(--r) 0}
.aba:hover{color:var(--text);border-color:var(--accent)}
.aba.tem{color:var(--accent);border-color:var(--accent)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.sechead h2{margin:0}
.fechar{
  background:none;border:none;cursor:pointer;color:var(--text-faint);
  font-size:17px;line-height:1;padding:0 2px;border-radius:3px;
}
.fechar:hover{color:var(--text)}

.row{display:flex;gap:6px;flex-wrap:wrap}
.row .btn{flex:1 1 auto;justify-content:center;padding:5px 6px;font-size:11.5px}
label.fld{display:block;font-size:11px;color:var(--text-dim);margin:9px 0 4px}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=number]{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 9px;font-size:12px;
}
input[type=search],input[type=text]{
  width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r);padding:6px 9px;font-size:12px;
}
.swbox{display:flex;align-items:center;gap:7px;padding:4px 0;cursor:pointer;font-size:12px}
.swbox input{accent-color:var(--accent);margin:0}

/* painel do elemento */
.empty{color:var(--text-faint);font-size:12px;padding:4px 0;line-height:1.6}
.keyparams{display:flex;flex-direction:column;gap:7px;margin-bottom:4px}
.kp{
  background:var(--surface-2);border:1px solid var(--line-soft);
  border-left:3px solid var(--accent);border-radius:4px;padding:7px 9px;
}
.kp .k{font-family:var(--display);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.kp .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-word}
.kp .src{font-size:10.5px;color:var(--text-dim);margin-top:2px;font-style:italic}
.kp.dn{border-left-color:var(--good)}
.kp.tp{border-left-color:var(--accent)}
.kp.sys{border-left-color:var(--warn)}
dl.props{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:11.5px}
dl.props dt{color:var(--text-dim);white-space:nowrap}
dl.props dd{margin:0;font-family:var(--mono);font-size:11px;word-break:break-word}
details.pset{margin-top:8px;border-top:1px solid var(--line-soft);padding-top:7px}
details.pset summary{
  cursor:pointer;font-family:var(--display);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text-faint);
}
details.pset[open] summary{color:var(--text-dim)}
details.pset dl{margin-top:6px}

/* gaveta inferior */
.drawer{
  flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
  display:flex;flex-direction:column;max-height:46vh;
}
.tabs{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--line);padding:0 10px;flex-wrap:wrap}
.tab{
  background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;
  padding:9px 12px;font-family:var(--display);font-size:11.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);
}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .spacer{flex:1 1 auto}
.tabs .btn{margin:4px 0 4px 6px}
.tabwrap{overflow:auto;padding:0;min-height:0;flex:1 1 auto}
.tabpane{display:none;padding:12px 14px}
.tabpane.on{display:block}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tile{
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:9px 13px;min-width:116px;
}
.tile .t{font-family:var(--display);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.tile .n{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .u{font-size:11px;color:var(--text-dim);font-weight:400}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:5px 9px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{
  font-family:var(--display);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-faint);position:sticky;top:0;background:var(--surface);z-index:1;
  border-bottom:1px solid var(--line);
}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--sel-linha)}
tbody tr.conj{box-shadow:inset 3px 0 0 var(--conj);background:var(--surface-2)}
.kp.conj{border-left-color:var(--conj)}
.nav{display:flex;align-items:center;gap:7px;margin-top:9px}
.nav .btn{flex:1 1 auto;justify-content:center;padding:5px 6px;font-size:11.5px}
.navct{
  font-family:var(--mono);font-size:11px;color:var(--text-dim);
  white-space:nowrap;font-variant-numeric:tabular-nums;min-width:66px;text-align:center;
}
tr.tot td{font-weight:600;border-top:1px solid var(--line);background:var(--surface-2)}
/* separadores da aba Apontamentos: faixa do grupo e linha ja concluida */
tr.grupo td{font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);background:var(--surface-2);border-top:1px solid var(--line)}
tbody tr.feito td{color:var(--text-faint)}
tbody tr.feito td:nth-child(5){text-decoration:line-through}   /* a coluna do texto */
.dnpill{
  display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;
  border-radius:9px;border:1px solid var(--line);
}
.clickable{cursor:pointer;user-select:none;-webkit-user-select:none}
.tablehint{font-size:11px;color:var(--text-faint);margin:0 0 9px}

/* overlays do visor */
.hud{
  position:absolute;left:12px;bottom:12px;display:flex;gap:7px;flex-wrap:wrap;
  pointer-events:none;
}
.hud .chip{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.18)}
/* barra de ocultação: aparece com uma peça selecionada e fica enquanto se oculta */
.ocultbar{
  position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:3;
  display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.28);
}
.ocultbar .btn{justify-content:center;font-size:11.5px;padding:4px 10px;white-space:nowrap}
.ocultbar .btn.prim{border-color:var(--accent,#4a90e2);font-weight:600}
.ocultbar .cnt{font-size:11px;color:var(--text-faint);white-space:nowrap}
.apopup{
  position:absolute;z-index:20;width:260px;background:var(--surface);border:1px solid var(--accent);
  border-radius:var(--r);box-shadow:0 4px 18px rgba(0,0,0,.35);padding:10px 11px;
}
.apopup .ptit{font-family:var(--display);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim)}
.apopup .psub{font-size:11.5px;margin:3px 0 7px;word-break:break-word}
.apopup textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;font:inherit;font-size:12px;resize:vertical}
.apopup .pdica{font-size:10px;color:var(--text-faint);margin-top:6px}
.viewbtns{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:5px}
.viewbtns .btn{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.18);justify-content:center;min-width:58px;font-size:11px;padding:4px 8px}
.tip{
  position:absolute;left:12px;top:12px;font-size:11px;color:var(--text-faint);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 1px 4px rgba(0,0,0,.18);
  padding:6px 9px;max-width:230px;line-height:1.5;
}
.tip b{color:var(--text-dim);font-weight:600}

/* carregando */
.loading{
  position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;z-index:50;padding:24px;text-align:center;
}
.loading h2{font-family:var(--display);font-size:16px;font-weight:600;margin:0;letter-spacing:.03em}
.bar{width:min(340px,80vw);height:4px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0%;background:var(--accent);transition:width .18s}
.loading p{color:var(--text-dim);font-size:12px;margin:0;font-family:var(--mono)}
.loading .err{color:var(--crit);max-width:520px;font-family:var(--body);line-height:1.6}
.hidden{display:none !important}

@media (max-width:1100px){
  aside{width:216px;flex-basis:216px}
  aside.right{width:244px;flex-basis:244px}
}
@media (max-width:860px){
  .rsz{display:none}
  .aba{display:none !important}
  #fecharEsq{display:none}
  #painelEsq{display:flex !important}   /* empilhado: sem aba para reabrir, então não recolhe */
  body{overflow:auto}
  .body{flex-direction:column}
  aside,aside.right{width:auto;flex-basis:auto;max-height:none;border:none;border-bottom:1px solid var(--line)}
  .stage{height:56vh;min-height:320px;order:-1}
  .drawer{max-height:none}
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <h2>Leitor IFC da Piscina</h2>
  <div class="bar"><i id="bar"></i></div>
  <p id="lmsg">Baixando o modelo</p>
  <p class="err hidden" id="lerr"></p>
</div>

<header>
  <div class="brand">
    <h1>Leitor IFC</h1>
    <span class="file" id="fileName">—</span>
  </div>
  <select id="modeloSel" title="Escolhe o modelo publicado; abre numa aba nova"></select>
  <div class="meta" id="meta"></div>
  <button class="btn" id="temaBtn" title="Alterna entre claro, escuro e o tema do sistema">Tema: automático</button>
  <a class="btn" id="baixarBtn" href="Leitor-IFC-Piscina.html" download="Leitor-IFC-Piscina.html" title="Baixa um arquivo único que abre com duplo clique, sem internet">Baixar versão offline</a>
  <button class="btn pri" id="openBtn">Abrir outro IFC</button>
  <input type="file" id="fileInput" accept=".ifc" class="hidden">
</header>

<div class="body">
  <!-- ============ painel esquerdo ============ -->
  <aside id="painelEsq">
    <div class="sec">
      <div class="sechead">
        <h2>Colorir por</h2>
        <button class="fechar" id="fecharEsq" title="Recolher o painel" aria-label="Recolher o painel">&times;</button>
      </div>
      <div class="modes" id="modes"></div>
    </div>

    <div class="sec">
      <h2 id="legTitle">Legenda</h2>
      <div class="legend" id="legend"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="showAll">Mostrar tudo</button>
        <button class="btn" id="invert">Inverter</button>
      </div>
    </div>

    <div class="sec">
      <h2>Visor</h2>
      <label class="swbox"><input type="checkbox" id="zoomClick" checked> Dar zoom na peça ao clicar</label>
      <label class="swbox"><input type="checkbox" id="focar" checked> Esmaecer o resto ao selecionar</label>
      <label class="fld" for="fadeCtx">Visibilidade do resto <span id="fadeV" class="mono">50%</span></label>
      <input type="range" id="fadeCtx" min="15" max="100" value="50">
      <label class="swbox"><input type="checkbox" id="ghost" checked> Mostrar oculto em transparência</label>
      <label class="swbox"><input type="checkbox" id="contorno" checked> Contorno nas peças (separa as conexões)</label>
      <label class="swbox"><input type="checkbox" id="grid" checked> Mostrar grade de referência</label>
      <label class="swbox"><input type="checkbox" id="flat"> Sombreamento plano (mostra as facetas)</label>
      <label class="fld" for="clip">Corte horizontal — cota <span id="clipV" class="mono"></span></label>
      <input type="range" id="clip" min="0" max="100" value="100">
      <div class="row" style="margin-top:9px">
        <button class="btn" id="isoSel">Isolar seleção</button>
        <button class="btn" id="hideSel">Ocultar seleção</button>
      </div>
    </div>
  </aside>

  <div class="rsz" id="rszEsq" title="Arraste para estreitar ou alargar o visor"></div>

  <!-- ============ visor ============ -->
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <button class="aba esq" id="abaEsq" title="Abrir o painel de cores e do visor" style="display:none">Cores e visor</button>
    <div class="viewbtns">
      <button class="btn" data-view="iso">Isométrica</button>
      <button class="btn" data-view="top">Planta</button>
      <button class="btn" data-view="front">Elevação</button>
      <button class="btn" data-view="side">Lateral</button>
      <button class="btn" data-view="fit">Enquadrar</button>
    </div>
    <div class="ocultbar hidden" id="barraOcultar"></div>
    <div class="hud" id="hud"></div>
    <button class="aba" id="abaDir" title="Abrir o painel de propriedades">Propriedades</button>
  </div>

  <div class="rsz" id="rszDir" title="Arraste para estreitar ou alargar o visor"></div>

  <!-- ============ painel direito ============ -->

<script src="ifc-build.js"></script>
<script>
"use strict";

/* =========================================================
   1. Paletas
   ========================================================= */
// cores por palavra-chave do sistema (convenção usual de piscina)
const CORES_SISTEMA = [
  [/quente|aquec|solar|t[ée]rmic/i, '#e8743b'],
  [/retorno|filtrad|press[aã]o|insufl/i, '#3f8fe0'],
  [/aspira[cç]/i,                    '#3dc88d'],
  [/ralo de fundo|fundo/i,           '#2bb3c9'],
  [/ralo|sucç|succ/i,                '#6fc5d8'],
  [/esgoto|dren|res[ií]du/i,         '#9a7b55'],
  [/extravas|overflow|vertedou/i,    '#a97fd4'],
  [/el[ée]tric|ilumina|energia/i,    '#e3c23f'],
  [/g[áa]s/i,                        '#e3c23f'],
  [/[áa]gua fria|fria|potav|pot[áa]vel/i, '#5fd0e8'],
  [/incend|hidrant|sprink/i,         '#e35d61']
];
const PALETA = ['#4da3ff','#3dc88d','#e8a33d','#d472c8','#5fd0e8','#9a7b55',
  '#a97fd4','#e3c23f','#e8743b','#6fc5d8','#8bbf4a','#e35d61','#7f8fa6','#c8a24d'];
// rampa por bitola: do menor (claro/frio) ao maior (quente/saturado)
const RAMPA_DN = ['#9fe6d8','#6fc5d8','#4da3ff','#8bbf4a','#e3c23f','#e8a33d','#e8743b','#e35d61','#c0527f','#a97fd4'];
const COR_SEM = '#5b6775';

function corSistema(nome, i) {
  for (const [re, c] of CORES_SISTEMA) if (re.test(nome)) return c;
  return PALETA[i % PALETA.length];
}
function hexRGB(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}

/* ---------- cores do visor por tema ---------- */
const TEMA3D = {
  dark: {
    fundo: 0x0b1016, grade: 0x27323f, ajusteCor: 1,
    fantasma: 0x6b7a8c, fantasmaOp: 0.075,
    foco: 0xfff1a8, conjunto: 0xff8a3d,
    contorno: 0x04070b, contornoOp: 0.9,
    ceu: 0xdfeaf5, chao: 0x2a3340, ambiente: 1.05, luz1: 0.55, luz2: 0.35
  },
  light: {
    fundo: 0xf4f6f9, grade: 0xc7d0da, ajusteCor: 0.8,
    fantasma: 0x334155, fantasmaOp: 0.09,
    foco: 0xc2185b, conjunto: 0xd35400,
    contorno: 0x111a24, contornoOp: 0.85,
    ceu: 0xffffff, chao: 0xb8c4d2, ambiente: 1.15, luz1: 0.45, luz2: 0.3
  }
};

function temaEfetivo() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark' || t === 'light') return t;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

/* =========================================================
   2. Estado
   ========================================================= */
const S = {
  model: null,
  modo: 'sistema',
  grupos: [],              // [{chave, rotulo, cor, n, visivel}]
  grupoDoEl: [],           // indice do grupo por elemento
  visivelEl: null,         // Uint8Array
  sel: -1,
  conj: null,              // {rotulo, ids, i} — linha de tabela agrupada
  clipZ: Infinity,
  ghost: true,
  zoomClique: true,
  focar: true,             // esmaece o resto do modelo quando há seleção
  ocultando: false,        // modo de ocultação ativo (barra com "Finalizar ocultações")
  contorno: true,          // silhueta em cada peça (passo de identificadores + borda na tela)
  pane: 'resumo',
  busca: '',
  ordem: { col: null, dir: 1 }
};

const MODOS = [
  { id: 'sistema',   nome: 'Sistema' },
  { id: 'diametro',  nome: 'Diâmetro (DN)' },
  { id: 'tipo',      nome: 'Tipo / família' },
  { id: 'categoria', nome: 'Categoria IFC' },
  { id: 'pavimento', nome: 'Pavimento' },
  { id: 'nativo',    nome: 'Cor original do IFC' }
];

/* ---- modelos publicados no site ----
   Cada página do leitor mostra um modelo. A escolha vem da URL (?modelo=hidro);
   sem nada, abre a piscina. O seletor no cabeçalho troca de modelo numa aba nova,
   então dá para comparar os dois lado a lado. Na versão de arquivo único o modelo
   vai embutido e o seletor é removido pelo build_standalone.py. */
const MODELOS = [
  { chave: 'piscina', arquivo: 'modelo.json',       nome: 'Piscina — Art Stay (R02)' },
  { chave: 'hidro',   arquivo: 'modelo-hidro.json', nome: 'Hidráulica — Tipo 1 e 2' }
];
const MODELO = (() => {
  let q = '';
  try { q = new URLSearchParams(location.search).get('modelo') || ''; } catch (err) { }
  return MODELOS.find(m => m.chave === q) ||
    // também aceita o nome do arquivo, desde que seja um .json da própria pasta
    (/^[\w.-]+\.json$/.test(q) ? { chave: q, arquivo: q, nome: q } : MODELOS[0]);
})();
// cada modelo guarda suas edições e seus apontamentos; o primeiro mantém as chaves antigas
const SUF_MODELO = MODELO.chave === 'piscina' ? '' : '-' + MODELO.chave;

const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };
const fmt = (v, d) => v.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });

/* =========================================================
   3. Carregamento
   ========================================================= */
async function descompacta(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('Não foi possível baixar o modelo (HTTP ' + res.status + ').');
  if (typeof DecompressionStream !== 'function')
    throw new Error('Este navegador não descompacta o modelo embutido. Use o botão "Abrir outro IFC" e escolha o arquivo .ifc do seu computador.');
  const pacote = await res.json();
  await progresso(0.015, 'Descompactando o modelo');
  const bin = atob(pacote.gz);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const fluxo = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(fluxo).text();
}

function progresso(f, msg) {
  $('#bar').style.width = Math.min(100, Math.round(f * 100)) + '%';
  if (msg) $('#lmsg').textContent = msg;
  return new Promise(r => requestAnimationFrame(() => r()));
}

function montarSeletorModelo() {
  const sel = $('#modeloSel');
  if (!sel) return;
  for (const m of MODELOS) sel.appendChild(Object.assign(el('option'), { value: m.chave, textContent: m.nome }));
  if (!MODELOS.some(m => m.chave === MODELO.chave))     // modelo passado pelo nome do arquivo
    sel.appendChild(Object.assign(el('option'), { value: MODELO.chave, textContent: MODELO.nome }));
  sel.value = MODELO.chave;
  sel.onchange = () => {
    const alvo = location.pathname + '?modelo=' + encodeURIComponent(sel.value);
    sel.value = MODELO.chave;                            // esta aba continua no modelo dela
    window.open(alvo, '_blank', 'noopener');
  };
  const atual = MODELOS.find(m => m.chave === MODELO.chave);
  if (atual) {
    document.title = 'Leitor IFC — ' + atual.nome;
    $('#loading').querySelector('h2').textContent = 'Leitor IFC — ' + atual.nome;
  }
}

async function iniciar() {
  try {
    montarSeletorModelo();
    await progresso(0.01, 'Baixando o modelo');
    const texto = await descompacta(MODELO.arquivo);
    await montar(texto);
  } catch (e) {
    $('#lerr').classList.remove('hidden');
    $('#lerr').textContent = e.message || String(e);
    $('#lmsg').textContent = 'Você ainda pode abrir um arquivo do seu computador:';
    const b = el('button', 'btn pri', 'Escolher arquivo .ifc');
    b.onclick = () => $('#fileInput').click();
    $('#loading').appendChild(b);
  }
}

async function montar(texto) {
  const M = await buildIfcModel(texto, progresso);
  await progresso(0.97, 'Preparando o visor');
  S.model = M;
  aplicarEdicoesSalvas(M);
  S.visivelEl = new Uint8Array(M.elements.length).fill(1);
  S.ocultando = false; ocultasDaSessao.clear();
  S.sel = -1;
  construirCena();
  montarCabecalho();
  montarModos();
  aplicarModo(S.modo);
  aplicarTema3D();
  const b = M.bbox;
  S.clipMin = b.min[2] - 0.02; S.clipMax = b.max[2] + 0.02;
  S.clipZ = S.clipMax;
  $('#clip').value = 100; atualizaClipLabel();
  enquadrar(undefined, false);
  renderTabs();
  painelElemento();
  $('#loading').classList.add('hidden');
}

function montarCabecalho() {
  const M = S.model;
  $('#fileName').textContent = M.origem || '(sem nome)';
  const m = $('#meta'); m.innerHTML = '';
  const chips = [
    M.schema,
    'unidade: ' + M.unidade,
    M.elements.length + ' elementos',
    (M.indices.length / 3).toLocaleString('pt-BR') + ' triângulos'
  ];
  if (M.dataExport) chips.push('exportado ' + M.dataExport.slice(0, 10).split('-').reverse().join('/'));
  for (const c of chips) m.appendChild(el('span', 'chip', c));
}

/* =========================================================
   4. Cena three.js
   ========================================================= */
let renderer, scene, cam, geomSolido, geomFantasma, geomSel, geomConj, geomContexto;
let meshSolido, meshFantasma, meshSel, meshConj, meshContexto, grade, raycaster;
let idxSolido, triSolido, idxFantasma, idxContexto, triContexto;
let nSolido = 0, nFantasma = 0, nContexto = 0;
let corAttr, luzes = {}, precisaRender = true;
// esmaecimento do resto do modelo: cor do fundo e quanto da cor original sobra
const uCtx = { uFundo: { value: new THREE.Color(0x0b1016) }, uFade: { value: 0.5 } };
let rtId, matId, cenaContorno, camContorno, matContorno;   // contorno por peça

/* Contorno por peça, em tela: a cena é desenhada num alvo com o número de cada
   peça no lugar da cor; depois um quadro cheio pinta o pixel onde o vizinho tem
   outro número. Separa a peça do fundo e uma peça da outra (um tubo de uma
   conexão), mesmo quando as duas têm a mesma cor. Não depende das normais. */
function montarContorno(M) {
  const eid = new Float32Array(M.positions.length / 3);
  for (const e of M.elements) for (let v = e.vStart; v < e.vStart + e.vCount; v++) eid[v] = e.i + 1;   // 0 = fundo

  if (!rtId) {
    rtId = new THREE.WebGLRenderTarget(4, 4, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true
    });
    rtId.depthTexture = new THREE.DepthTexture(4, 4);          // profundidade lida pelo quadro cheio
    rtId.depthTexture.type = THREE.UnsignedIntType;
    rtId.depthTexture.minFilter = rtId.depthTexture.magFilter = THREE.NearestFilter;
    matId = new THREE.ShaderMaterial({
      side: THREE.DoubleSide, blending: THREE.NoBlending,
      vertexShader: 'attribute float eid; varying float vId;' +
        'void main(){ vId = eid; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: 'varying float vId;' +
        'void main(){ float n = floor(vId + 0.5); float lo = mod(n, 256.0); float hi = floor(n / 256.0);' +
        ' gl_FragColor = vec4(lo / 255.0, hi / 255.0, 0.0, 1.0); }'
    });
    matContorno = new THREE.ShaderMaterial({
      transparent: true, depthTest: false, depthWrite: false,
      uniforms: {
        tId: { value: rtId.texture }, tProf: { value: rtId.depthTexture },
        res: { value: new THREE.Vector2(1, 1) }, near: { value: 0.1 }, far: { value: 100 },
        cor: { value: new THREE.Color(0x04070b) }, op: { value: 0.9 }, raio: { value: 1 }, limiar: { value: 0.012 }
      },
      vertexShader: 'void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }',
      // Contorno onde há fundo ou degrau de profundidade, e não onde só muda o número
      // da peça: peças que se sobrepõem na mesma superfície (tubo dentro de conexão)
      // alternam de número em manchas e geravam emendas falsas.
      fragmentShader: 'uniform sampler2D tId; uniform sampler2D tProf; uniform vec2 res;' +
        'uniform float near; uniform float far; uniform vec3 cor; uniform float op; uniform float raio; uniform float limiar;' +
        'float temPeca(vec2 uv){ vec4 t = texture2D(tId, uv); return t.r + t.g; }' +          // 0 = fundo
        'float profLinear(vec2 uv){ float z = texture2D(tProf, uv).x * 2.0 - 1.0;' +
        '  return (2.0 * near * far) / (far + near - z * (far - near)); }' +
        'void main(){' +
        '  vec2 uv = gl_FragCoord.xy / res;' +
        '  if (temPeca(uv) < 0.001) discard;' +
        '  float zc = profLinear(uv);' +
        '  vec2 px = raio / res; float fora = 0.0;' +
        // 16 amostras em 2 anéis (0,9 e 1,9 px), o segundo girado meio passo. A fração
        // delas que cai no fundo ou numa peça bem mais perto vira a transparência da
        // linha: em vez de ligar/desligar por pixel (serrilhado), ela cai suavemente.
        '  for (int k = 0; k < 16; k++) {' +
        '    float kk = float(k); bool anel2 = kk >= 8.0;' +
        '    float a = mod(kk, 8.0) * 0.785398 + (anel2 ? 0.3927 : 0.0);' +
        '    vec2 q = uv + vec2(cos(a), sin(a)) * px * (anel2 ? 1.9 : 0.9);' +
        '    if (temPeca(q) < 0.001) fora += 1.0;' +                  // silhueta contra o fundo
        '    else if (profLinear(q) < zc * (1.0 - limiar)) fora += 1.0;' +   // vizinho bem mais perto: esta é a de trás
        '  }' +
        '  float forca = smoothstep(0.0, 0.5, fora / 16.0);' +
        '  if (forca < 0.02) discard;' +
        '  gl_FragColor = vec4(cor, op * forca); }'
    });
    cenaContorno = new THREE.Scene();
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), matContorno);
    quad.frustumCulled = false;
    cenaContorno.add(quad);
    camContorno = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  }
  return new THREE.BufferAttribute(eid, 1);
}

function ajustarContorno() {
  if (!rtId || !renderer) return;
  const sz = renderer.getDrawingBufferSize(new THREE.Vector2());
  rtId.setSize(sz.x, sz.y);
  matContorno.uniforms.res.value.set(sz.x, sz.y);
  matContorno.uniforms.raio.value = Math.max(1, renderer.getPixelRatio());   // 1 px do dispositivo; os anéis do shader usam 0,9 e 1,9 desse valor
}

/* O contorno custa um passo de desenho a mais (no modelo inteiro, quando não há
   seleção). Enquanto a câmera se move ele é pulado e volta ~0,2 s depois que ela
   para, então girar e dar zoom custam o mesmo de antes. */
let ultimoMovimento = 0, timerContorno = 0;
const ATRASO_CONTORNO = 200;   // ms parado até o contorno voltar

function desenharContorno(foco) {
  if (!S.contorno || !rtId) return;
  if (performance.now() - ultimoMovimento < ATRASO_CONTORNO) {
    clearTimeout(timerContorno);
    timerContorno = setTimeout(() => { precisaRender = true; }, ATRASO_CONTORNO + 20);
    return;
  }
  const vis = { fan: meshFantasma.visible, ctx: meshContexto.visible, gr: grade ? grade.visible : false };
  const cor = new THREE.Color(), alfa = renderer.getClearAlpha();
  renderer.getClearColor(cor);
  meshFantasma.visible = false; if (grade) grade.visible = false;
  if (foco) meshContexto.visible = false;      // com seleção, só o destaque leva contorno

  matContorno.uniforms.near.value = cam.near; matContorno.uniforms.far.value = cam.far;
  scene.overrideMaterial = matId;
  renderer.setRenderTarget(rtId);
  renderer.setClearColor(0x000000, 0);
  renderer.autoClear = false;
  renderer.clear();
  renderer.render(scene, cam);
  renderer.setRenderTarget(null);
  scene.overrideMaterial = null;
  renderer.setClearColor(cor, alfa);

  renderer.render(cenaContorno, camContorno);  // sobre o quadro já desenhado
  renderer.autoClear = true;
  meshFantasma.visible = vis.fan; meshContexto.visible = vis.ctx; if (grade) grade.visible = vis.gr;
}

function construirCena() {
  const M = S.model, cv = $('#cv');
  if (!renderer) {
    renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
    renderer.setClearColor(0x0b1016, 1);
    raycaster = new THREE.Raycaster();
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  if (scene) scene.clear();
  scene = new THREE.Scene();

  const pos = new THREE.BufferAttribute(M.positions, 3);
  const cores = new Uint8Array(M.positions.length);
  corAttr = new THREE.BufferAttribute(cores, 3, true);

  // normais a partir de uma geometria temporária com o índice completo
  const tmp = new THREE.BufferGeometry();
  tmp.setAttribute('position', pos);
  tmp.setIndex(new THREE.BufferAttribute(M.indices, 1));
  tmp.computeVertexNormals();
  const nrm = tmp.getAttribute('normal');

  idxSolido = new Uint32Array(M.indices.length);
  idxFantasma = new Uint32Array(M.indices.length);
  idxContexto = new Uint32Array(M.indices.length);
  triSolido = new Uint32Array(M.indices.length / 3);
  triContexto = new Uint32Array(M.indices.length / 3);

  const eidAttr = montarContorno(M);
  const mk = (indice) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', pos);
    g.setAttribute('normal', nrm);
    g.setAttribute('eid', eidAttr);
    g.setAttribute('color', corAttr);
    g.setIndex(new THREE.BufferAttribute(indice, 1));
    return g;
  };
  geomSolido = mk(idxSolido);
  geomFantasma = mk(idxFantasma);
  geomSel = mk(new Uint32Array(0));
  geomConj = mk(new Uint32Array(0));
  geomContexto = mk(idxContexto);

  const centro = new THREE.Vector3(
    (M.bbox.min[0] + M.bbox.max[0]) / 2, (M.bbox.min[1] + M.bbox.max[1]) / 2, (M.bbox.min[2] + M.bbox.max[2]) / 2);
  const raio = Math.hypot(M.bbox.max[0] - M.bbox.min[0], M.bbox.max[1] - M.bbox.min[1], M.bbox.max[2] - M.bbox.min[2]);
  for (const g of [geomSolido, geomFantasma, geomSel, geomConj, geomContexto]) g.boundingSphere = new THREE.Sphere(centro, raio);

  const matSolido = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  const matFantasma = new THREE.MeshBasicMaterial({
    color: 0x6b7a8c, transparent: true, opacity: 0.075, depthWrite: false, side: THREE.DoubleSide
  });
  // destaque iluminado (Lambert), para a peça mostrar o volume em vez de uma mancha chapada
  const matSel = new THREE.MeshLambertMaterial({ color: 0xfff1a8, side: THREE.DoubleSide });
  const matConj = new THREE.MeshLambertMaterial({ color: 0xff8a3d, side: THREE.DoubleSide });
  // resto do modelo enquanto há seleção: opaco e iluminado como o modelo normal, e só
  // depois misturado com o fundo no fim do fragmento (uFade = quanto da cor sobra).
  // Sem mesclagem (transparência) não há acúmulo onde os tubos se cruzam, então o
  // esmaecimento fica igual em toda a cena, e a iluminação mantém o volume das peças.
  const matContexto = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  matContexto.onBeforeCompile = (sh) => {
    sh.uniforms.uFundo = uCtx.uFundo; sh.uniforms.uFade = uCtx.uFade;
    sh.fragmentShader = 'uniform vec3 uFundo; uniform float uFade;\n' + sh.fragmentShader.replace(
      '#include <dithering_fragment>',
      'gl_FragColor.rgb = mix(uFundo, gl_FragColor.rgb, uFade);\n#include <dithering_fragment>');
  };

  meshSolido = new THREE.Mesh(geomSolido, matSolido);
  meshFantasma = new THREE.Mesh(geomFantasma, matFantasma);
  meshConj = new THREE.Mesh(geomConj, matConj);
  meshSel = new THREE.Mesh(geomSel, matSel);
  meshContexto = new THREE.Mesh(geomContexto, matContexto);
  meshSolido.frustumCulled = meshFantasma.frustumCulled = meshSel.frustumCulled =
    meshConj.frustumCulled = meshContexto.frustumCulled = false;
  meshContexto.renderOrder = 1; meshFantasma.renderOrder = 2; meshConj.renderOrder = 3; meshSel.renderOrder = 4;
  scene.add(meshSolido, meshFantasma, meshContexto, meshConj, meshSel);

  luzes.amb = new THREE.HemisphereLight(0xdfeaf5, 0x2a3340, 1.05);
  luzes.d1 = new THREE.DirectionalLight(0xffffff, 0.55); luzes.d1.position.set(0.5, -0.8, 1.2);
  luzes.d2 = new THREE.DirectionalLight(0xbcd4ea, 0.35); luzes.d2.position.set(-0.9, 0.6, 0.4);
  scene.add(luzes.amb, luzes.d1, luzes.d2);

  // grade no plano XY, na cota mais baixa
  const ext = Math.max(M.bbox.max[0] - M.bbox.min[0], M.bbox.max[1] - M.bbox.min[1]);
  const passo = ext > 120 ? 20 : ext > 60 ? 10 : ext > 25 ? 2 : ext > 10 ? 1 : 0.5;
  const div = Math.max(4, Math.ceil(ext * 1.25 / passo));
  grade = new THREE.GridHelper(div * passo, div, 0x2b3744, 0x1d2630);
  grade.material.vertexColors = false;
  grade.rotateX(Math.PI / 2);
  grade.position.set(centro.x, centro.y, M.bbox.min[2] - 0.05);
  scene.add(grade);

  // planos de corte e limites de aproximação proporcionais ao tamanho do modelo
  LIM.diag = Math.max(1, raio);
  LIM.min = Math.max(0.02, LIM.diag / 2500);
  LIM.max = LIM.diag * 6;
  if (!cam) {
    cam = new THREE.PerspectiveCamera(45, 1, LIM.min / 2, LIM.diag * 15);
    cam.up.set(0, 0, 1);
    instalarControles(cv);
  } else {
    cam.near = LIM.min / 2; cam.far = LIM.diag * 15; cam.updateProjectionMatrix();
  }
  redimensionar();
}

/* ---------- controles de órbita próprios (sem dependência externa) ---------- */
const orb = { alvo: new THREE.Vector3(), r: 20, teta: -0.9, fi: 1.05 };
const LIM = { min: 0.02, max: 3000, diag: 30 };
const limitarR = (v) => Math.max(LIM.min, Math.min(LIM.max, v));

/* Ponto sob o cursor, para o zoom aproximar do que está debaixo do mouse.
   Testa a caixa envolvente de cada peça — 722 testes, barato o bastante para
   rodar a cada giro da roda (um raycast contra os 507 mil triângulos levaria ~47 ms). */
function pontoSobCursor(ev) {
  const cv = $('#cv'), b = cv.getBoundingClientRect();
  const m = new THREE.Vector2(
    ((ev.clientX - b.left) / b.width) * 2 - 1,
    -((ev.clientY - b.top) / b.height) * 2 + 1);
  raycaster.setFromCamera(m, cam);
  const o = raycaster.ray.origin, d = raycaster.ray.direction;
  let melhor = Infinity;
  const els = S.model ? S.model.elements : [];
  for (let i = 0; i < els.length; i++) {
    const e = els[i];
    if (!e.min || !elementoVisivel(i)) continue;
    // método das fatias: interseção de raio com caixa alinhada aos eixos
    let t0 = 0, t1 = Infinity, ok = true;
    for (let k = 0; k < 3; k++) {
      const inv = 1 / (d.getComponent(k) || 1e-12);
      let a = (e.min[k] - o.getComponent(k)) * inv;
      let c = (e.max[k] - o.getComponent(k)) * inv;
      if (a > c) { const tmp = a; a = c; c = tmp; }
      if (a > t0) t0 = a;
      if (c < t1) t1 = c;
      if (t0 > t1) { ok = false; break; }
    }
    if (ok && t0 > 0 && t0 < melhor) melhor = t0;
  }
  if (melhor < Infinity) return raycaster.ray.at(melhor, new THREE.Vector3());
  // nada sob o cursor: usa o plano que passa pelo ponto de órbita
  const plano = new THREE.Plane().setFromNormalAndCoplanarPoint(
    cam.getWorldDirection(new THREE.Vector3()), orb.alvo);
  const q = new THREE.Vector3();
  return raycaster.ray.intersectPlane(plano, q) ? q : orb.alvo.clone();
}

/* Aproxima mantendo fixo o ponto sob o cursor: escala câmera e pivô em torno dele. */
function aproximar(ev, fatorBruto) {
  const rNovo = limitarR(orb.r * fatorBruto);
  const f = rNovo / orb.r;
  if (f === 1) return;
  const P = pontoSobCursor(ev);
  orb.alvo.sub(P).multiplyScalar(f).add(P);
  orb.r = rNovo;
  posicionarCamera();
}

function posicionarCamera() {
  const sf = Math.sin(orb.fi), cf = Math.cos(orb.fi);
  cam.position.set(
    orb.alvo.x + orb.r * sf * Math.cos(orb.teta),
    orb.alvo.y + orb.r * sf * Math.sin(orb.teta),
    orb.alvo.z + orb.r * cf);
  cam.lookAt(orb.alvo);
  // Os planos de corte acompanham a distância. Fixo em 1 cm, o plano próximo
  // gastaria quase toda a precisão de profundidade e os tubos brigariam entre si
  // quando a vista estivesse afastada.
  const perto = Math.max(LIM.min / 2, orb.r / 1000);
  const longe = orb.r + LIM.diag * 3;
  if (cam.near !== perto || cam.far !== longe) {
    cam.near = perto; cam.far = longe; cam.updateProjectionMatrix();
  }
  ultimoMovimento = performance.now();
  precisaRender = true;
}

function instalarControles(cv) {
  let arrastando = 0, px = 0, py = 0, movido = 0, botaoAtivo = -1;
  const EPS = 1e-4;

  const pan = (dx, dy) => {
    const esc = orb.r * 0.0016;
    const dir = new THREE.Vector3().subVectors(orb.alvo, cam.position).normalize();
    const dirColuna = new THREE.Vector3().crossVectors(dir, cam.up).normalize();
    const cima = new THREE.Vector3().crossVectors(dirColuna, dir).normalize();
    orb.alvo.addScaledVector(dirColuna, dx * esc).addScaledVector(cima, dy * esc);
  };

  // 1 = girar (giroscópio), 2 = deslocar
  // A câmera só se move com o botão do meio: sozinho desloca, com Shift gira.
  // O esquerdo serve para selecionar e o direito para abrir apontamento; nenhum
  // dos dois mexe na vista (decidido em 19/11/2026).
  function modoDoBotao(e) {
    if (e.button === 1) return e.shiftKey ? 1 : 2;
    return 0;
  }

  cv.addEventListener('pointerdown', e => {
    fecharPopupApontamento();
    if (e.button === 1) e.preventDefault();      // corta a rolagem automática do navegador
    cv.setPointerCapture(e.pointerId);
    pararAnimacao();
    botaoAtivo = e.button;
    arrastando = modoDoBotao(e);
    px = e.clientX; py = e.clientY; movido = 0;
  });
  // o Chrome só desiste da rolagem automática se o mousedown do meio for barrado
  cv.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); });
  cv.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });
  cv.addEventListener('pointermove', e => {
    const dx = e.clientX - px, dy = e.clientY - py;
    px = e.clientX; py = e.clientY;
    if (botaoAtivo < 0) return;
    movido += Math.abs(dx) + Math.abs(dy);   // conta também com o esquerdo e o direito,
    if (!arrastando) return;                 // que não movem a câmera mas precisam distinguir
                                             // um clique parado de um arrasto
    if (arrastando === 1) {
      orb.teta -= dx * 0.006;
      orb.fi = Math.max(EPS, Math.min(Math.PI - EPS, orb.fi - dy * 0.006));
    } else pan(-dx, dy);
    posicionarCamera();
  });
  cv.addEventListener('pointerup', e => {
    // só o botão esquerdo seleciona, e só parado (Shift ou Ctrl somam à seleção)
    if (botaoAtivo === 0 && movido < 5) selecionarPorClique(e);
    // botão direito parado (sem arrastar) numa peça: novo apontamento
    if (e.button === 2 && botaoAtivo === 2 && movido < 5) abrirPopupApontamento(e);
    arrastando = 0; botaoAtivo = -1;
  });
  cv.addEventListener('pointercancel', () => { arrastando = 0; botaoAtivo = -1; });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('wheel', e => {
    e.preventDefault(); pararAnimacao();
    aproximar(e, Math.exp(e.deltaY * 0.0005));
  }, { passive: false });

  // toque: 2 dedos = zoom + deslocar
  let dist0 = 0, mid0 = null;
  cv.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      dist0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      mid0 = [(e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2];
      arrastando = 0; pararAnimacao();
    }
  }, { passive: true });
  cv.addEventListener('touchmove', e => {
    if (e.touches.length !== 2 || !mid0) return;
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const mid = [(e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2];
    if (dist0 > 0) aproximar({ clientX: mid[0], clientY: mid[1] }, dist0 / d);
    pan(-(mid[0] - mid0[0]), mid[1] - mid0[1]);
    dist0 = d; mid0 = mid;
    posicionarCamera();
  }, { passive: false });
  cv.addEventListener('touchend', () => { mid0 = null; }, { passive: true });

  addEventListener('keydown', e => {
    const alvo = e.target;
    if (alvo && (alvo.tagName === 'INPUT' || alvo.tagName === 'TEXTAREA' || alvo.tagName === 'SELECT')) return;
    const passo = 22;
    if (e.key === 'ArrowLeft') pan(passo, 0);
    else if (e.key === 'ArrowRight') pan(-passo, 0);
    else if (e.key === 'ArrowUp') pan(0, -passo);
    else if (e.key === 'ArrowDown') pan(0, passo);
    else if (e.key === 'Escape') { limparSelecao(); return; }
    else if (S.conj && (e.key === 'n' || e.key === 'N')) { passoConjunto(1); return; }
    else if (S.conj && (e.key === 'p' || e.key === 'P')) { passoConjunto(-1); return; }
    else return;
    e.preventDefault(); posicionarCamera();
  });
}

function redimensionar() {
  const st = $('#stage');
  const w = st.clientWidth, h = st.clientHeight;
  if (!w || !h || !renderer) return;
  renderer.setSize(w, h, false);
  ajustarContorno();
  cam.aspect = w / h; cam.updateProjectionMatrix();
  precisaRender = true;
}
addEventListener('resize', redimensionar);

function enquadrar(alvoIdx, animado) {
  const M = S.model;
  let mn, mx;
  const lista = Array.isArray(alvoIdx) ? alvoIdx : (alvoIdx != null && alvoIdx >= 0 ? [alvoIdx] : null);
  if (lista && lista.length) {
    mn = [Infinity, Infinity, Infinity]; mx = [-Infinity, -Infinity, -Infinity];
    for (const idx of lista) {
      const e = M.elements[idx];
      if (!e || !e.min) continue;
      for (let k = 0; k < 3; k++) {
        if (e.min[k] < mn[k]) mn[k] = e.min[k];
        if (e.max[k] > mx[k]) mx[k] = e.max[k];
      }
    }
    if (!isFinite(mn[0])) { mn = M.bbox.min; mx = M.bbox.max; }
    else {
      // folga ao redor da peça: um joelho de 10 cm precisa ver o tubo que chega nele
      const maior = Math.max(mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]);
      // 30% de folga ao redor, sem ultrapassar uma fração do próprio modelo
      const diag = Math.hypot(M.bbox.max[0] - M.bbox.min[0], M.bbox.max[1] - M.bbox.min[1], M.bbox.max[2] - M.bbox.min[2]);
      const folga = Math.min(Math.max(0.1, maior * 0.3), diag * 0.06);
      mn = mn.map(v => v - folga); mx = mx.map(v => v + folga);
    }
  } else { mn = M.bbox.min; mx = M.bbox.max; }
  const alvo = new THREE.Vector3((mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2);
  const meio = [(mx[0] - mn[0]) / 2, (mx[1] - mn[1]) / 2, (mx[2] - mn[2]) / 2];
  // eixos da câmera na orientação atual
  const sf = Math.sin(orb.fi), cf = Math.cos(orb.fi);
  const frente = new THREE.Vector3(-sf * Math.cos(orb.teta), -sf * Math.sin(orb.teta), -cf).normalize();
  const dir = new THREE.Vector3().crossVectors(frente, cam.up).normalize();
  const cima = new THREE.Vector3().crossVectors(dir, frente).normalize();
  const extensao = (v) => Math.abs(meio[0] * v.x) + Math.abs(meio[1] * v.y) + Math.abs(meio[2] * v.z);
  const tgV = Math.tan(cam.fov * Math.PI / 360);
  const tgH = tgV * Math.max(0.3, cam.aspect || 1);
  const r = Math.max(extensao(cima) / tgV, extensao(dir) / tgH) * 1.12 + extensao(frente);
  irPara(alvo, limitarR(r), animado);
}

/* ---------- deslocamento suave da câmera ---------- */
let animCam = null;
const movimentoReduzido = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function pararAnimacao() { animCam = null; }

function irPara(alvo, r, animado) {
  if (!animado || movimentoReduzido()) {
    animCam = null;
    orb.alvo.copy(alvo); orb.r = r; posicionarCamera();
    return;
  }
  animCam = { a0: orb.alvo.clone(), a1: alvo.clone(), r0: orb.r, r1: r, t0: performance.now(), ms: 430 };
  requestAnimationFrame(passoAnimacao);
}

function passoAnimacao() {
  if (!animCam) return;
  const t = Math.min(1, (performance.now() - animCam.t0) / animCam.ms);
  const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  orb.alvo.lerpVectors(animCam.a0, animCam.a1, e);
  orb.r = animCam.r0 + (animCam.r1 - animCam.r0) * e;
  posicionarCamera();
  if (t < 1) requestAnimationFrame(passoAnimacao); else animCam = null;
}

function vista(v) {
  pararAnimacao();
  if (v === 'fit') { enquadrar(S.sel >= 0 ? S.sel : undefined, true); return; }
  if (v === 'top') { orb.teta = -Math.PI / 2; orb.fi = 0.02; }
  else if (v === 'front') { orb.teta = -Math.PI / 2; orb.fi = Math.PI / 2; }
  else if (v === 'side') { orb.teta = 0; orb.fi = Math.PI / 2; }
  else { orb.teta = -0.9; orb.fi = 1.05; }
  enquadrar(undefined, true);
}

/* O fantasma (peças ocultas em transparência) pode ter centenas de milhares de
   triângulos translúcidos, que dobram o custo de cada quadro quando poucos sistemas
   estão visíveis. Enquanto a câmera se move ele não é desenhado; volta ~0,2 s depois. */
let timerFantasma = 0;
function laco() {
  requestAnimationFrame(laco);
  if (!renderer || !scene || !precisaRender) return;
  precisaRender = false;

  const fanReal = meshFantasma.visible;
  if (fanReal && performance.now() - ultimoMovimento < ATRASO_CONTORNO) {
    meshFantasma.visible = false;
    clearTimeout(timerFantasma);
    timerFantasma = setTimeout(() => { precisaRender = true; }, ATRASO_CONTORNO + 20);
  }
  desenharQuadro();
  meshFantasma.visible = fanReal;
}

function desenharQuadro() {
  const foco = meshContexto && meshContexto.visible;
  if (!foco) { renderer.autoClear = true; renderer.render(scene, cam); desenharContorno(false); return; }

  // 1º passo: o modelo esmaecido, com profundidade própria
  const v = {
    sol: meshSolido.visible, conj: meshConj.visible, sel: meshSel.visible,
    fan: meshFantasma.visible, gr: grade ? grade.visible : false
  };
  renderer.autoClear = false;
  renderer.clear();
  meshSolido.visible = false; meshConj.visible = false; meshSel.visible = false;
  renderer.render(scene, cam);

  // 2º passo: zera a profundidade para a seleção aparecer mesmo atrás de outros tubos
  renderer.clearDepth();
  meshContexto.visible = false; meshFantasma.visible = false; if (grade) grade.visible = false;
  meshSolido.visible = v.sol; meshConj.visible = v.conj; meshSel.visible = v.sel;
  renderer.render(scene, cam);

  meshContexto.visible = true; meshFantasma.visible = v.fan; if (grade) grade.visible = v.gr;
  desenharContorno(true);
  renderer.autoClear = true;
}
laco();

function aplicarTema3D() {
  if (!renderer) return;
  const t = TEMA3D[temaEfetivo()];
  renderer.setClearColor(t.fundo, 1);
  uCtx.uFundo.value.setHex(t.fundo);
  if (grade) { grade.material.color.setHex(t.grade); grade.material.needsUpdate = true; }
  if (meshFantasma) { meshFantasma.material.color.setHex(t.fantasma); meshFantasma.material.opacity = t.fantasmaOp; }
  if (meshSel) meshSel.material.color.setHex(t.foco);
  if (meshConj) meshConj.material.color.setHex(t.conjunto);
  if (matContorno) { matContorno.uniforms.cor.value.setHex(t.contorno); matContorno.uniforms.op.value = t.contornoOp; }
  if (luzes.amb) { luzes.amb.color.setHex(t.ceu); luzes.amb.groundColor.setHex(t.chao); luzes.amb.intensity = t.ambiente; }
  if (luzes.d1) luzes.d1.intensity = t.luz1;
  if (luzes.d2) luzes.d2.intensity = t.luz2;
  if (S.model) pintar();
  precisaRender = true;
}

/* =========================================================
   5. Coloração e visibilidade
   ========================================================= */
function chaveGrupo(e, modo) {
  switch (modo) {
    case 'sistema':   return e.sistemaClasse;
    case 'diametro':  return e.dn ? 'DN ' + e.dn : 'sem diâmetro';
    case 'tipo':      return e.objType || '(sem tipo)';
    case 'categoria': return e.categoria;
    case 'pavimento': return e.pavimento;
    case 'nativo':    return e.corNativa ? 'cor do IFC' : 'sem cor no IFC';
  }
  return '';
}

function aplicarModo(modo) {
  S.modo = modo;
  const M = S.model, els = M.elements;
  const mapa = new Map();
  S.grupoDoEl = new Array(els.length);

  for (let i = 0; i < els.length; i++) {
    const k = chaveGrupo(els[i], modo);
    let gi = mapa.get(k);
    if (gi === undefined) { gi = mapa.size; mapa.set(k, gi); }
    S.grupoDoEl[i] = gi;
  }

  const chaves = [...mapa.keys()];
  // ordenação sensata por modo
  let ordem = chaves.map((c, i) => i);
  if (modo === 'diametro') {
    ordem.sort((a, b) => {
      const na = parseInt((chaves[a].match(/\d+/) || [1e9])[0]), nb = parseInt((chaves[b].match(/\d+/) || [1e9])[0]);
      return na - nb;
    });
  } else {
    ordem.sort((a, b) => chaves[a].localeCompare(chaves[b], 'pt-BR'));
  }

  const antigos = new Map(S.grupos.map(g => [g.chave, g.visivel]));
  const nova = new Array(chaves.length);
  const grupos = [];
  ordem.forEach((velho, novo) => {
    nova[velho] = novo;
    const chave = chaves[velho];
    grupos.push({ chave, cor: '#888', n: 0, m: 0, visivel: antigos.has(chave) ? antigos.get(chave) : true });
  });
  S.grupoDoEl = S.grupoDoEl.map(g => nova[g]);

  for (let i = 0; i < els.length; i++) {
    const g = grupos[S.grupoDoEl[i]];
    g.n++; g.m += els[i].comprimento || 0;
  }

  // cores
  const nSemCor = /sem (diâmetro|tipo|sistema|cor)|\(sem/i;
  let j = 0;
  grupos.forEach((g, i) => {
    if (nSemCor.test(g.chave)) { g.cor = COR_SEM; return; }
    if (modo === 'sistema') g.cor = corSistema(g.chave, j++);
    else if (modo === 'diametro') g.cor = RAMPA_DN[Math.min(RAMPA_DN.length - 1, j++)];
    else g.cor = PALETA[(j++) % PALETA.length];
  });
  S.grupos = grupos;

  pintar();
  atualizarVisibilidade();
  renderLegenda();
}

function pintar() {
  const M = S.model, els = M.elements, cores = corAttr.array;
  const t = TEMA3D[temaEfetivo()];
  const aj = t.ajusteCor;
  const rgbCache = S.grupos.map(g => hexRGB(g.cor));
  for (let i = 0; i < els.length; i++) {
    const e = els[i];
    let rgb;
    if (S.modo === 'nativo' && e.corNativa) {
      rgb = [Math.round(e.corNativa.r * 255), Math.round(e.corNativa.g * 255), Math.round(e.corNativa.b * 255)];
    } else rgb = rgbCache[S.grupoDoEl[i]];
    // no tema claro as cores são aprofundadas para não lavarem no fundo branco
    const c0 = Math.round(rgb[0] * aj), c1 = Math.round(rgb[1] * aj), c2 = Math.round(rgb[2] * aj);
    const fim = (e.vStart + e.vCount) * 3;
    for (let p = e.vStart * 3; p < fim; p += 3) {
      cores[p] = c0; cores[p + 1] = c1; cores[p + 2] = c2;
    }
  }
  corAttr.needsUpdate = true;
  precisaRender = true;
}

function elementoVisivel(i) {
  if (!S.visivelEl[i]) return false;
  if (!S.grupos[S.grupoDoEl[i]].visivel) return false;
  const e = S.model.elements[i];
  if (S.clipZ < Infinity && e.vCount) {
    // mantém a peça se o ponto mais baixo estiver abaixo do corte
    if (e.min && e.min[2] > S.clipZ) return false;
  }
  return true;
}

// conjunto de peças em destaque no momento (seleção única ou linha de tabela)
function idsDestacados() {
  if (S.conj && S.conj.ids.length) {
    const m = new Set(S.conj.ids);
    if (S.sel >= 0) m.add(S.sel);
    return m;
  }
  if (S.sel >= 0) return new Set([S.sel]);
  return null;
}

function atualizarVisibilidade() {
  const M = S.model, els = M.elements, src = M.indices;
  const destaque = S.focar ? idsDestacados() : null;
  nSolido = 0; nFantasma = 0; nContexto = 0;
  let t = 0, tc = 0;
  for (let i = 0; i < els.length; i++) {
    const e = els[i];
    if (!e.iCount) continue;
    if (elementoVisivel(i)) {
      // com uma seleção ativa, o resto do modelo vai para a malha esmaecida
      if (destaque && !destaque.has(i)) {
        for (let k = 0; k < e.iCount; k++) idxContexto[nContexto + k] = src[e.iStart + k];
        for (let k = 0; k < e.iCount / 3; k++) triContexto[tc + k] = i;
        nContexto += e.iCount; tc += e.iCount / 3;
      } else {
        for (let k = 0; k < e.iCount; k++) idxSolido[nSolido + k] = src[e.iStart + k];
        for (let k = 0; k < e.iCount / 3; k++) triSolido[t + k] = i;
        nSolido += e.iCount; t += e.iCount / 3;
      }
    } else if (S.ghost) {
      for (let k = 0; k < e.iCount; k++) idxFantasma[nFantasma + k] = src[e.iStart + k];
      nFantasma += e.iCount;
    }
  }
  geomSolido.index.needsUpdate = true;
  geomFantasma.index.needsUpdate = true;
  geomContexto.index.needsUpdate = true;
  geomSolido.setDrawRange(0, nSolido);
  geomFantasma.setDrawRange(0, nFantasma);
  geomContexto.setDrawRange(0, nContexto);
  meshFantasma.visible = S.ghost && nFantasma > 0;
  meshContexto.visible = nContexto > 0;
  atualizarSelecao();
  atualizarHud();
  precisaRender = true;
}

// toda mudança de seleção refaz a divisão entre destaque e contexto
function atualizarDestaque() { atualizarVisibilidade(); }

function pintarMalha(geom, mesh, ids) {
  const M = S.model;
  const usados = (ids || []).filter(i => M.elements[i] && M.elements[i].iCount && elementoVisivel(i));
  if (!usados.length) { mesh.visible = false; precisaRender = true; return; }
  let total = 0;
  for (const i of usados) total += M.elements[i].iCount;
  const arr = new Uint32Array(total);
  let o = 0;
  for (const i of usados) {
    const e = M.elements[i];
    for (let k = 0; k < e.iCount; k++) arr[o + k] = M.indices[e.iStart + k];
    o += e.iCount;
  }
  geom.setIndex(new THREE.BufferAttribute(arr, 1));
  geom.setDrawRange(0, total);
  mesh.visible = true;
  precisaRender = true;
}

function atualizarSelecao() {
  pintarMalha(geomSel, meshSel, S.sel >= 0 ? [S.sel] : []);
  pintarMalha(geomConj, meshConj, S.conj ? S.conj.ids : []);
}

/* ---- ocultar peças pelo visor ----
   Com uma peça (ou várias) selecionada, a barra oferece "Ocultar". Depois do
   primeiro uso o modo de ocultação fica ativo: cada clique seguinte seleciona outra
   peça para ocultar, até "Finalizar ocultações", que DEVOLVE ao visor todas as
   peças ocultas por esta barra (ocultar serve para ver o que está atrás). "Mostrar
   tudo" também as devolve, e ocultações feitas por outros botões não são tocadas. */
// peças ocultas por esta barra, na sessão de ocultação em curso
const ocultasDaSessao = new Set();

function contarOcultas() {
  let n = 0;
  for (const i of ocultasDaSessao) if (!S.visivelEl[i]) n++;     // "Mostrar tudo" já as devolveu?
  return n;
}

function ocultarSelecao() {
  const ids = idsDestacados();
  if (!ids || !ids.size) return;
  for (const i of ids) { S.visivelEl[i] = 0; ocultasDaSessao.add(i); }
  S.ocultando = true;
  limparSelecao();            // segue no modo: o próximo clique escolhe a próxima peça
  renderTabs();
}

// Finalizar devolve ao visor o que foi ocultado por aqui e sai do modo.
function finalizarOcultacoes() {
  for (const i of ocultasDaSessao) S.visivelEl[i] = 1;
  ocultasDaSessao.clear();
  S.ocultando = false;
  limparSelecao();            // também refaz visor, tabelas e a barra
  renderTabs();
}

function atualizarBarraOcultar() {
  const bar = $('#barraOcultar'); if (!bar) return;
  const nOcultas = contarOcultas();
  if (S.ocultando && !nOcultas) { S.ocultando = false; ocultasDaSessao.clear(); }   // "Mostrar tudo" encerra o modo
  const ids = idsDestacados();
  const nSel = ids ? ids.size : 0;
  bar.innerHTML = '';
  if (!nSel && !S.ocultando) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  if (nSel) {
    const b = el('button', 'btn prim', nSel === 1 ? 'Ocultar peça' : 'Ocultar ' + nSel + ' peças');
    b.title = 'Tira do visor e das tabelas a seleção atual';
    b.onclick = ocultarSelecao;
    bar.appendChild(b);
  }
  if (S.ocultando) {
    bar.appendChild(el('span', 'cnt', nOcultas + (nOcultas === 1 ? ' peça oculta' : ' peças ocultas')));
    const f = el('button', 'btn', 'Finalizar ocultações');
    f.title = 'Devolve ao visor as peças ocultas por esta barra e sai do modo de ocultação.';
    f.onclick = finalizarOcultacoes;
    bar.appendChild(f);
  }
}

function atualizarHud() {
  atualizarBarraOcultar();
  const hud = $('#hud'); hud.innerHTML = '';
  const vis = S.model.elements.reduce((s, _, i) => s + (elementoVisivel(i) ? 1 : 0), 0);
  const q = quantitativos(S.model, (e) => elementoVisivel(e.i));
  hud.appendChild(el('span', 'chip', vis + ' de ' + S.model.elements.length + ' elementos à vista'));
  hud.appendChild(el('span', 'chip', fmt(q.totalM, 2) + ' m de tubo visível'));
  if (S.conj) hud.appendChild(el('span', 'chip', S.conj.ids.length + ' peças selecionadas'));
  if (S.sel >= 0) {
    const e = S.model.elements[S.sel];
    hud.appendChild(el('span', 'chip', 'em foco: ' + (e.tipo || e.categoria) + (e.dn ? ' · DN ' + e.dn : '')));
  }
}

/* =========================================================
   6. Seleção
   ========================================================= */
// índice da peça sob o cursor (-1 = nada)
function pecaSobCursor(ev) {
  const r = $('#cv').getBoundingClientRect();
  const m = new THREE.Vector2(
    ((ev.clientX - r.left) / r.width) * 2 - 1,
    -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(m, cam);
  const alvos = [meshSolido];
  if (meshContexto.visible) alvos.push(meshContexto);
  const hits = raycaster.intersectObjects(alvos, false);

  let alvo = -1;
  if (hits.length) {
    const h = hits[0], f = h.faceIndex;
    const doContexto = h.object === meshContexto;
    const mapa = doContexto ? triContexto : triSolido;
    const limite = (doContexto ? nContexto : nSolido) / 3;
    if (f != null && f < limite) alvo = mapa[f];
  }
  return alvo;
}

function selecionarPorClique(ev) {
  const alvo = pecaSobCursor(ev);

  if (somando(ev)) {
    // somar não dá zoom nem limpa a seleção quando o clique cai no vazio
    if (alvo >= 0) alternarNaSelecao([alvo]);
    return;
  }

  S.sel = alvo;
  if (S.sel < 0) S.conj = null;
  else if (S.conj && S.conj.ids.indexOf(S.sel) < 0) S.conj = null;
  else if (S.conj) S.conj.i = S.conj.ids.indexOf(S.sel);
  painelElemento(); atualizarDestaque(); marcarLinha();
  if (S.sel >= 0 && S.zoomClique) enquadrar(S.sel, true);
}

const somando = (ev) => !!(ev && (ev.shiftKey || ev.ctrlKey || ev.metaKey));

function selecionar(i, enquadra) {
  S.sel = i; S.conj = null;
  painelElemento(); atualizarDestaque(); marcarLinha();
  if (enquadra) enquadrar(i, true);
}

function selecionarConjunto(rotulo, ids, chave) {
  const visiveis = ids.filter(i => elementoVisivel(i));
  const usar = visiveis.length ? visiveis : ids;
  S.conj = { rotulo, ids: usar, i: -1, chave };
  S.sel = -1;
  painelElemento(); atualizarDestaque(); marcarLinha();
  enquadrar(usar, true);
}

function passoConjunto(d) {
  if (!S.conj || !S.conj.ids.length) return;
  const n = S.conj.ids.length;
  S.conj.i = (S.conj.i + d + n * 2) % n;
  S.sel = S.conj.ids[S.conj.i];
  painelElemento(); atualizarDestaque(); marcarLinha();
  enquadrar(S.sel, true);
}

// Shift (ou Ctrl/Cmd) soma à seleção; repetir no mesmo item tira ele de volta.
function alternarNaSelecao(ids) {
  const atual = new Set(S.conj ? S.conj.ids : (S.sel >= 0 ? [S.sel] : []));
  const validos = ids.filter(i => i >= 0 && S.model.elements[i]);
  if (!validos.length) return;
  const jaTodos = validos.every(i => atual.has(i));
  for (const i of validos) { if (jaTodos) atual.delete(i); else atual.add(i); }
  const lista = [...atual];
  if (!lista.length) { limparSelecao(); return; }
  S.conj = { rotulo: 'Seleção manual', ids: lista, i: -1, chave: null };
  S.sel = jaTodos ? -1 : validos[validos.length - 1];
  if (S.sel >= 0) S.conj.i = lista.indexOf(S.sel);
  painelElemento(); atualizarDestaque(); marcarLinha();
}

function limparSelecao() {
  S.sel = -1; S.conj = null;
  painelElemento(); atualizarDestaque(); marcarLinha();
}

function montarModos() {
  const c = $('#modes'); c.innerHTML = '';
  for (const m of MODOS) {

    const r = el('input'); r.type = 'radio'; r.name = 'modo'; r.value = m.id; r.checked = m.id === S.modo;
    r.onchange = () => { aplicarModo(m.id); montarModos(); renderTabs(); };
    lab.appendChild(r); lab.appendChild(el('span', null, m.nome));
    c.appendChild(lab);
  }
}

function prefixoComum(nomes) {
  const uteis = nomes.filter(n => !/\(sem |^sem /i.test(n));
  if (uteis.length < 3) return '';
  const minimo = Math.ceil(uteis.length * 0.6);
  const SEP = /[\s\-\u2013\u2014:|\/]/;
  for (const base of uteis.slice(0, 3)) {
    const cortes = [];
    for (let i = 1; i < Math.min(base.length, 42); i++)
      if (SEP.test(base[i - 1]) && !SEP.test(base[i])) cortes.push(i);
    for (const i of cortes.reverse()) {
      const pre = base.slice(0, i);
      if (pre.trim().length < 3) continue;
      if (uteis.filter(n => n.startsWith(pre)).length >= minimo) return pre;
    }
  }
  return '';
}

/* ---- Edição manual de nome, sistema e diâmetro ----
   As edições ficam no navegador (localStorage), por GUID da peça, e valem sobre qualquer
   leitura do IFC: o valor original é guardado em e.orig e volta com "Restaurar". */
const EDIC_KEY = 'leitor-ifc-edicoes' + SUF_MODELO;
let edicoes = {};
try { edicoes = JSON.parse(localStorage.getItem(EDIC_KEY) || '{}') || {}; } catch (err) { edicoes = {}; }
const salvarEdicoes = () => { try { localStorage.setItem(EDIC_KEY, JSON.stringify(edicoes)); } catch (err) { } };
const nomeEl = (e) => e.nomeEd || e.tipo || e.familia;

function aplicarEdicao(e) {
  if (!e.orig) e.orig = { sistemaClasse: e.sistemaClasse, sistema: e.sistema, sistemas: e.sistemas, dn: e.dn, dnFonte: e.dnFonte, dnPortas: e.dnPortas, dnParam: e.dnParam };
  const o = e.orig, ed = edicoes[e.guid] || {};
  e.nomeEd = ed.nome || '';
  e.sistemaClasse = ed.sistema || o.sistemaClasse;
  e.sistema = ed.sistema || o.sistema;
  e.sistemas = ed.sistema ? [ed.sistema] : o.sistemas;
  if (ed.dn > 0) { e.dn = ed.dn; e.dnFonte = 'manual'; e.dnPortas = []; e.dnParam = ''; }
  else { e.dn = o.dn; e.dnFonte = o.dnFonte; e.dnPortas = o.dnPortas; e.dnParam = o.dnParam; }
  e.editado = !!(ed.nome || ed.sistema || ed.dn > 0);
}

function aplicarEdicoesSalvas(M) {
  for (const e of M.elements) if (edicoes[e.guid]) aplicarEdicao(e);
  atualizarListasModelo(M);
}

function atualizarListasModelo(M) {
  M.diametros = [...new Set(M.elements.filter(e => e.dn).map(e => e.dn))].sort((a, b) => a - b);
  M.sistemas = [...new Set(M.elements.map(e => e.sistemaClasse))].sort();
}

/* campos[k]: undefined = não mexe (mantém o que já estava, inclusive edição anterior);
   null = tira a edição desse campo (volta ao valor do IFC); outro valor = grava. */
function gravarEdicao(ids, campos, restaurar) {
  const M = S.model;
  for (const i of ids) {
    const e = M.elements[i];
    if (restaurar) delete edicoes[e.guid];
    else {
      const ed = Object.assign({}, edicoes[e.guid]);
      for (const k of ['nome', 'sistema', 'dn']) {
        if (campos[k] === null) delete ed[k];
        else if (campos[k] !== undefined) ed[k] = campos[k];
      }
      if (ed.nome || ed.sistema || ed.dn) edicoes[e.guid] = ed; else delete edicoes[e.guid];
    }
    aplicarEdicao(e);
  }
  salvarEdicoes();
  atualizarListasModelo(M);
  aplicarModo(S.modo);
  renderTabs();
  painelElemento();
  atualizarDestaque();
}

const DN_COMERCIAIS = [20, 25, 32, 40, 50, 60, 75, 85, 100, 110, 125, 150, 160, 200];   // mm

/* ids: peças afetadas. Com uma peça, os campos vêm preenchidos com o valor atual e só o
   que for mudado é gravado. Com várias, começam em "manter" e só o que for preenchido muda. */
function editorEdicao(ids) {
  const M = S.model, uma = ids.length === 1 ? M.elements[ids[0]] : null;
  const box = el('details', 'pset'); box.style.marginTop = '10px';
  box.appendChild(el('summary', null, 'Editar nome, sistema e diâmetro' + (uma ? '' : ' (' + ids.length + ' peças)')));
  const rotulo = (t) => box.appendChild(el('div', null, t)).style.cssText = 'font-size:11px;color:var(--text-dim);margin:7px 0 2px';

  rotulo('Nome');
  const iNome = el('input'); iNome.type = 'text'; iNome.style.width = '100%';
  const nomeAtual = uma ? (nomeEl(uma) || '') : '';
  iNome.value = nomeAtual; iNome.placeholder = uma ? '' : '(manter os nomes atuais)';
  box.appendChild(iNome);

  rotulo('Sistema');
  const iSis = el('input'); iSis.type = 'text'; iSis.style.width = '100%';
  const sisAtual = uma ? uma.sistemaClasse : '';
  iSis.value = sisAtual; iSis.placeholder = uma ? '' : '(manter os sistemas atuais)';
  iSis.setAttribute('list', 'listaSistemas');
  let dl = document.getElementById('listaSistemas');
  if (!dl) { dl = el('datalist'); dl.id = 'listaSistemas'; document.body.appendChild(dl); }
  dl.innerHTML = '';
  for (const s of M.sistemas) dl.appendChild(Object.assign(el('option'), { value: s }));
  box.appendChild(iSis);

  rotulo('Diâmetro (mm)');
  const sDn = el('select'); sDn.style.width = '100%';
  const opt = (v, t) => sDn.appendChild(Object.assign(el('option'), { value: String(v), textContent: t }));
  const dnAtual = uma ? (uma.dn || 0) : -1;
  if (!uma) opt('', '(manter os diâmetros atuais)');
  else if (!dnAtual) opt('0', '— (sem diâmetro definido)');
  const lista = DN_COMERCIAIS.slice();
  if (dnAtual > 0 && lista.indexOf(dnAtual) < 0) lista.push(dnAtual), lista.sort((a, b) => a - b);   // valor fora da lista não se perde
  for (const d of lista) opt(d, d + ' mm' + (d === dnAtual && uma.dnPortas.length > 1 ? ' (maior boca)' : ''));
  opt('outro', 'Outro valor…');
  sDn.value = uma ? String(dnAtual) : '';
  box.appendChild(sDn);
  const iOutro = el('input'); iOutro.type = 'number'; iOutro.min = 1; iOutro.step = 1;
  iOutro.placeholder = 'Diâmetro em mm'; iOutro.style.cssText = 'width:100%;margin-top:5px;display:none';
  box.appendChild(iOutro);
  sDn.onchange = () => { iOutro.style.display = sDn.value === 'outro' ? '' : 'none'; if (sDn.value === 'outro') iOutro.focus(); };

  const acoes = el('div', 'row'); acoes.style.marginTop = '9px';
  const ok = el('button', 'btn pri', 'Aplicar');
  ok.onclick = () => {
    const c = {};   // undefined = mantém
    const nome = iNome.value.trim(), sis = iSis.value.trim();
    if (uma) {
      const nomeOrig = uma.tipo || uma.familia || '', sisOrig = uma.orig ? uma.orig.sistemaClasse : uma.sistemaClasse;
      if (nome !== nomeAtual) c.nome = (nome === '' || nome === nomeOrig) ? null : nome;
      if (sis !== sisAtual && sis !== '') c.sistema = sis === sisOrig ? null : sis;
    } else {
      if (nome) c.nome = nome;
      if (sis) c.sistema = sis;
    }
    let dn = sDn.value === 'outro' ? Math.round(+iOutro.value) || 0 : (+sDn.value || 0);
    if (sDn.value === 'outro' && !dn) { iOutro.focus(); return; }
    if (dn > 0 && dn !== dnAtual) {
      const dnOrig = uma && uma.orig ? uma.orig.dn : (uma ? uma.dn : 0);
      c.dn = uma && dn === dnOrig ? null : dn;
    }
    gravarEdicao(ids, c, false);
  };
  const rest = el('button', 'btn', 'Restaurar original');
  rest.onclick = () => gravarEdicao(ids, {}, true);
  acoes.appendChild(ok); acoes.appendChild(rest);
  box.appendChild(acoes);
  const n = ids.filter(i => M.elements[i].editado).length;
  if (n) box.open = true;
  if (n) box.appendChild(el('div', 'src', n + (n > 1 ? ' peças com edição manual' : ' peça com edição manual') + ' · salvas neste navegador')).style.cssText = 'font-size:10.5px;color:var(--text-faint);margin-top:6px';
  return box;
}
