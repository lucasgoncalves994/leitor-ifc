<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor IFC da Piscina</title>
<meta name="description" content="Visualizador de IFC no navegador: modelo 3D, parâmetros, quantitativos e apontamentos.">
<meta name="theme-color" content="#1d6fc4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)">
<!-- pwa:ini --><!-- instalável no celular: manifesto, ícones e service worker -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leitor IFC">
<meta name="mobile-web-app-capable" content="yes">
<!-- pwa:fim -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
(function () {
  var r = document.documentElement;
  r.dataset.temaHost = r.getAttribute('data-theme') || '';
  var m = null;
  try { m = localStorage.getItem('leitor-ifc-tema'); } catch (e) { }
  if (m === 'light' || m === 'dark') r.setAttribute('data-theme', m);
})();
</script>
<style>
/* Prancha de projeto: painéis fixos nas laterais, visor 3D no centro,
   quantitativos numa gaveta inferior. Dois temas sobre os mesmos tokens. */
/* Paleta clara como base; a escura redefine os mesmos tokens. */
:root{
  color-scheme: light;
  --bg:#eef1f5;
  --surface:#ffffff;
  --surface-2:#f3f6f9;
  --surface-3:#e6ebf1;
  --line:#cdd6e0;
  --line-soft:#e1e7ee;
  --text:#16222f;
  --text-dim:#55677c;
  --text-faint:#7d8ea3;
  --accent:#1d6fc4;
  --accent-dim:#d4e6f8;
  --good:#17895e;
  --warn:#9a6508;
  --crit:#b3272c;
  --conj:#d35400;
  --sel-linha:#d4e6f8;
  --visor:#f4f6f9;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Helvetica,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f141b;
    --surface:#18202b;
    --surface-2:#1f2935;
    --surface-3:#273341;
    --line:#2f3d4d;
    --line-soft:#243040;
    --text:#e6edf5;
    --text-dim:#8fa0b4;
    --text-faint:#64748b;
    --accent:#49a0f0;
    --accent-dim:#2a4a69;
    --good:#3dc88d;
    --warn:#e0a141;
    --crit:#e35d61;
    --conj:#ff8a3d;
    --sel-linha:#2a4a69;
    --visor:#0b1016;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f141b;
  --surface:#18202b;
  --surface-2:#1f2935;
  --surface-3:#273341;
  --line:#2f3d4d;
  --line-soft:#243040;
  --text:#e6edf5;
  --text-dim:#8fa0b4;
  --text-faint:#64748b;
  --accent:#49a0f0;
  --accent-dim:#2a4a69;
  --good:#3dc88d;
  --warn:#e0a141;
  --crit:#e35d61;
  --conj:#ff8a3d;
  --sel-linha:#2a4a69;
  --visor:#0b1016;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--body);
  font-size:13px;line-height:1.45;overflow:hidden;
  display:flex;flex-direction:column;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- cabeçalho ---------- */
header{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:9px 16px;background:var(--surface);
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand h1{
  font-family:var(--display);font-size:15px;font-weight:700;margin:0;
  letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;
}
.brand .file{
  font-family:var(--mono);font-size:11px;color:var(--text-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;
}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;
  padding:3px 7px;border:1px solid var(--line);border-radius:3px;
  color:var(--text-dim);background:var(--surface-2);white-space:nowrap;
}
.btn{
  background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r);
  padding:5px 11px;cursor:pointer;font-weight:500;font-size:12px;
  display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s;
}
a.btn{color:inherit;text-decoration:none}
.btn:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn.pri{background:var(--accent-dim);border-color:var(--accent);color:var(--text)}
.btn.pri:hover{filter:brightness(1.08)}

/* ---------- corpo ---------- */
.body{flex:1 1 auto;display:flex;min-height:0}
aside{
  width:252px;flex:0 0 252px;background:var(--surface);
  border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;
}
aside.right{border-right:none;border-left:1px solid var(--line);width:296px;flex-basis:296px}
.sec{border-bottom:1px solid var(--line-soft);padding:12px 14px}
.sec h2{
  font-family:var(--display);font-size:10.5px;font-weight:700;margin:0 0 9px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);
}
.stage{flex:1 1 auto;position:relative;min-width:0;background:var(--visor)}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* seletor de coloração */
.modes{display:flex;flex-direction:column;gap:2px}
.mode{
  display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:var(--r);
  cursor:pointer;border:1px solid transparent;
}
.mode:hover{background:var(--surface-2)}
.mode.on{background:var(--accent-dim);border-color:var(--accent);color:var(--text)}
.mode input{accent-color:var(--accent);margin:0}

/* legenda */
.legend{display:flex;flex-direction:column;gap:1px;margin:0 -4px}
.lrow{
  display:grid;grid-template-columns:14px 1fr auto auto;align-items:center;gap:8px;
  padding:4px 5px;border-radius:4px;cursor:pointer;
}
.lrow:hover{background:var(--surface-2)}
.lrow.off{opacity:.33}
.sw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(128,128,128,.5)}
.lrow .nm{
  font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lrow .ct{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.lrow .iso{
  font-size:10px;color:var(--text-faint);border:1px solid var(--line);
  border-radius:3px;padding:1px 4px;visibility:hidden;background:var(--surface-3);
}
.lrow:hover .iso{visibility:visible}
.lrow .iso:hover{color:var(--accent);border-color:var(--accent-dim)}

/* alças de redimensionamento nas bordas do visor */
.rsz{flex:0 0 6px;background:var(--line-soft);cursor:col-resize;position:relative;transition:background .12s}
.rsz.h{flex:0 0 6px;width:100%;cursor:row-resize}
.rsz:hover,.rsz.ativa{background:var(--accent)}
.rsz::after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:2px;height:26px;border-radius:2px;background:var(--line);
}
.rsz.h::after{width:26px;height:2px}
.rsz:hover::after,.rsz.ativa::after{background:var(--surface)}

/* aba para reabrir o painel de propriedades */
.aba{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;background:var(--surface);
  border:1px solid var(--line);border-right:none;border-radius:var(--r) 0 0 var(--r);
  padding:14px 5px;cursor:pointer;font-family:var(--display);font-size:11px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim);
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}
.aba.esq{right:auto;left:0;border:1px solid var(--line);border-left:none;border-radius:0 var(--r) var(--r) 0}
.aba:hover{color:var(--text);border-color:var(--accent)}
.aba.tem{color:var(--accent);border-color:var(--accent)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.sechead h2{margin:0}
.fechar{
  background:none;border:none;cursor:pointer;color:var(--text-faint);
  font-size:17px;line-height:1;padding:0 2px;border-radius:3px;
}
.fechar:hover{color:var(--text)}

.row{display:flex;gap:6px;flex-wrap:wrap}
.row .btn{flex:1 1 auto;justify-content:center;padding:5px 6px;font-size:11.5px}
label.fld{display:block;font-size:11px;color:var(--text-dim);margin:9px 0 4px}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=number]{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 9px;font-size:12px;
}
input[type=search],input[type=text]{
  width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r);padding:6px 9px;font-size:12px;
}
.swbox{display:flex;align-items:center;gap:7px;padding:4px 0;cursor:pointer;font-size:12px}
.swbox input{accent-color:var(--accent);margin:0}

/* painel do elemento */
.empty{color:var(--text-faint);font-size:12px;padding:4px 0;line-height:1.6}
a.del{color:var(--text-faint);cursor:pointer;text-decoration:underline}
a.del.conf{color:var(--accent);font-weight:600;text-decoration:none}
.keyparams{display:flex;flex-direction:column;gap:7px;margin-bottom:4px}
.kp{
  background:var(--surface-2);border:1px solid var(--line-soft);
  border-left:3px solid var(--accent);border-radius:4px;padding:7px 9px;
}
.kp .k{font-family:var(--display);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.kp .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-word}
.kp .src{font-size:10.5px;color:var(--text-dim);margin-top:2px;font-style:italic}
.kp.dn{border-left-color:var(--good)}
.kp.tp{border-left-color:var(--accent)}
.kp.sys{border-left-color:var(--warn)}
dl.props{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:11.5px}
dl.props dt{color:var(--text-dim);white-space:nowrap}
dl.props dd{margin:0;font-family:var(--mono);font-size:11px;word-break:break-word}
details.pset{margin-top:8px;border-top:1px solid var(--line-soft);padding-top:7px}
details.pset summary{
  cursor:pointer;font-family:var(--display);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text-faint);
}
details.pset[open] summary{color:var(--text-dim)}
details.pset dl{margin-top:6px}

/* gaveta inferior */
.drawer{
  flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
  display:flex;flex-direction:column;max-height:46vh;
}
.tabs{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--line);padding:0 10px;flex-wrap:wrap}
.tab{
  background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;
  padding:9px 12px;font-family:var(--display);font-size:11.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);
}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .spacer{flex:1 1 auto}
.tabs .btn{margin:4px 0 4px 6px}
.tabwrap{overflow:auto;padding:0;min-height:0;flex:1 1 auto}
.tabpane{display:none;padding:12px 14px}
.tabpane.on{display:block}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tile{
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:9px 13px;min-width:116px;
}
.tile .t{font-family:var(--display);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.tile .n{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .u{font-size:11px;color:var(--text-dim);font-weight:400}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:5px 9px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{
  font-family:var(--display);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-faint);position:sticky;top:0;background:var(--surface);z-index:1;
  border-bottom:1px solid var(--line);
}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--sel-linha)}
tbody tr.conj{box-shadow:inset 3px 0 0 var(--conj);background:var(--surface-2)}
.kp.conj{border-left-color:var(--conj)}
.nav{display:flex;align-items:center;gap:7px;margin-top:9px}
.nav .btn{flex:1 1 auto;justify-content:center;padding:5px 6px;font-size:11.5px}
.navct{
  font-family:var(--mono);font-size:11px;color:var(--text-dim);
  white-space:nowrap;font-variant-numeric:tabular-nums;min-width:66px;text-align:center;
}
tr.tot td{font-weight:600;border-top:1px solid var(--line);background:var(--surface-2)}
/* separadores da aba Apontamentos: faixa do grupo e linha ja concluida */
tr.grupo td{font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);background:var(--surface-2);border-top:1px solid var(--line)}
tbody tr.feito td{color:var(--text-faint)}
tbody tr.feito td:nth-child(5){text-decoration:line-through}   /* a coluna do texto */
.dnpill{
  display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;
  border-radius:9px;border:1px solid var(--line);
}
.clickable{cursor:pointer;user-select:none;-webkit-user-select:none}
.tablehint{font-size:11px;color:var(--text-faint);margin:0 0 9px}

/* overlays do visor */
.hud{
  position:absolute;left:12px;bottom:12px;display:flex;gap:7px;flex-wrap:wrap;
  pointer-events:none;
}
.hud .chip{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.18)}
/* barra de ocultação: aparece com uma peça selecionada e fica enquanto se oculta */
.ocultbar{
  position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:3;
  display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.28);
}
.ocultbar .btn{justify-content:center;font-size:11.5px;padding:4px 10px;white-space:nowrap}
.ocultbar .btn.prim{border-color:var(--accent,#4a90e2);font-weight:600}
.ocultbar .cnt{font-size:11px;color:var(--text-faint);white-space:nowrap}
.apopup{
  position:absolute;z-index:20;width:260px;background:var(--surface);border:1px solid var(--accent);
  border-radius:var(--r);box-shadow:0 4px 18px rgba(0,0,0,.35);padding:10px 11px;
}
.apopup .ptit{font-family:var(--display);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim)}
.apopup .psub{font-size:11.5px;margin:3px 0 7px;word-break:break-word}
.apopup textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;font:inherit;font-size:12px;resize:vertical}
.apopup .pdica{font-size:10px;color:var(--text-faint);margin-top:6px}
.viewbtns{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:5px}
.viewbtns .btn{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.18);justify-content:center;min-width:58px;font-size:11px;padding:4px 8px}
.tip{
  position:absolute;left:12px;top:12px;font-size:11px;color:var(--text-faint);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 1px 4px rgba(0,0,0,.18);
  padding:6px 9px;max-width:230px;line-height:1.5;
}
.tip b{color:var(--text-dim);font-weight:600}

/* carregando */
.loading{
  position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;z-index:50;padding:24px;text-align:center;
}
.loading h2{font-family:var(--display);font-size:16px;font-weight:600;margin:0;letter-spacing:.03em}
.bar{width:min(340px,80vw);height:4px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0%;background:var(--accent);transition:width .18s}
.loading p{color:var(--text-dim);font-size:12px;margin:0;font-family:var(--mono)}
.loading .err{color:var(--crit);max-width:520px;font-family:var(--body);line-height:1.6}
.hidden{display:none !important}

@media (max-width:1100px){
  aside{width:216px;flex-basis:216px}
  aside.right{width:244px;flex-basis:244px}
}
@media (max-width:860px){
  .rsz{display:none}
  .aba{display:none !important}
  #fecharEsq{display:none}
  #painelEsq{display:flex !important}   /* empilhado: sem aba para reabrir, então não recolhe */
  body{overflow:auto}
  .body{flex-direction:column}
  aside,aside.right{width:auto;flex-basis:auto;max-height:none;border:none;border-bottom:1px solid var(--line)}
  .stage{height:56vh;min-height:320px;order:-1}
  .drawer{max-height:none}
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <h2>Leitor IFC da Piscina</h2>
  <div class="bar"><i id="bar"></i></div>
  <p id="lmsg">Baixando o modelo</p>
  <p class="err hidden" id="lerr"></p>
</div>

<header>
  <div class="brand">
    <h1>Leitor IFC</h1>
    <span class="file" id="fileName">—</span>
  </div>
  <select id="modeloSel" title="Escolhe o modelo publicado; abre numa aba nova"></select>
  <div class="meta" id="meta"></div>
  <button class="btn" id="temaBtn" title="Alterna entre claro, escuro e o tema do sistema">Tema: automático</button>
  <a class="btn" id="baixarBtn" href="Leitor-IFC-Piscina.html" download="Leitor-IFC-Piscina.html" title="Baixa um arquivo único que abre com duplo clique, sem internet">Baixar versão offline</a>
  <button class="btn pri" id="openBtn">Abrir outro IFC</button>
  <input type="file" id="fileInput" accept=".ifc" class="hidden">
</header>

<div class="body">
  <!-- ============ painel esquerdo ============ -->
  <aside id="painelEsq">
    <div class="sec">
      <div class="sechead">
        <h2>Colorir por</h2>
        <button class="fechar" id="fecharEsq" title="Recolher o painel" aria-label="Recolher o painel">&times;</button>
      </div>
      <div class="modes" id="modes"></div>
    </div>

    <div class="sec">
      <h2 id="legTitle">Legenda</h2>
      <div class="legend" id="legend"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="showAll">Mostrar tudo</button>
        <button class="btn" id="invert">Inverter</button>
      </div>
    </div>

    <div class="sec">
      <h2>Visor</h2>
      <label class="swbox"><input type="checkbox" id="zoomClick" checked> Dar zoom na peça ao clicar</label>
      <label class="swbox"><input type="checkbox" id="focar" checked> Esmaecer o resto ao selecionar</label>
      <label class="fld" for="fadeCtx">Visibilidade do resto <span id="fadeV" class="mono">50%</span></label>
      <input type="range" id="fadeCtx" min="15" max="100" value="50">
      <label class="swbox"><input type="checkbox" id="ghost" checked> Mostrar oculto em transparência</label>
      <label class="swbox"><input type="checkbox" id="contorno" checked> Contorno nas peças (separa as conexões)</label>
      <label class="swbox"><input type="checkbox" id="grid" checked> Mostrar grade de referência</label>
      <label class="swbox"><input type="checkbox" id="flat"> Sombreamento plano (mostra as facetas)</label>
      <label class="fld" for="clip">Corte horizontal — cota <span id="clipV" class="mono"></span></label>
      <input type="range" id="clip" min="0" max="100" value="100">
      <div class="row" style="margin-top:9px">
        <button class="btn" id="isoSel">Isolar seleção</button>
        <button class="btn" id="hideSel">Ocultar seleção</button>
      </div>
    </div>

const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };

/* =========================================================

async function descompacta(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('Não foi possível baixar o modelo (HTTP ' + res.status + ').');
  if (typeof DecompressionStream !== 'function')
    throw new Error('Este navegador não descompacta o modelo embutido. Use o botão "Abrir outro IFC" e escolha o arquivo .ifc do seu computador.');
  const pacote = await res.json();
  await progresso(0.015, 'Descompactando o modelo');
  const bin = atob(pacote.gz);
  S.nomeArquivo = pacote.origem || '';           // o FILE_NAME interno do IFC pode ser outro ("070.ifc")
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const fluxo = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(fluxo).text();
}

function progresso(f, msg) {
  $('#bar').style.width = Math.min(100, Math.round(f * 100)) + '%';
  if (msg) $('#lmsg').textContent = msg;
  return new Promise(r => requestAnimationFrame(() => r()));
}

function montarSeletorModelo() {
  const sel = $('#modeloSel');
  if (!sel) return;
  for (const m of MODELOS) sel.appendChild(Object.assign(el('option'), { value: m.chave, textContent: m.nome }));
  if (!MODELOS.some(m => m.chave === MODELO.chave))     // modelo passado pelo nome do arquivo
    sel.appendChild(Object.assign(el('option'), { value: MODELO.chave, textContent: MODELO.nome }));
  sel.value = MODELO.chave;
  sel.onchange = () => {
    const alvo = location.pathname + '?modelo=' + encodeURIComponent(sel.value);
    sel.value = MODELO.chave;                            // esta aba continua no modelo dela
    window.open(alvo, '_blank', 'noopener');
  };
  const atual = MODELOS.find(m => m.chave === MODELO.chave);
  if (atual) {
    document.title = 'Leitor IFC — ' + atual.nome;
    $('#loading').querySelector('h2').textContent = 'Leitor IFC — ' + atual.nome;
  }
}

async function iniciar() {
  try {

async function montar(texto) {

/* ---- correções do projetista ----------------------------------------------
   O IFC fica como está; o leitor aplica a correção ao montar o modelo, então
   ela vale para quem abrir o link e entra nos quantitativos. São duas coisas:
   `trocar` muda bitola e descrição de uma peça (por GUID) e `criar` desenha a
   peça que faltou ser modelada, encostada nas portas de um certo DN da peça
   indicada. A geometria criada é um cilindro simples: serve para ver e contar,
   não veio do IFC (`criado: true`, e a origem do DN aparece como correção). */
function portasDe(M, e) {
  const m = M.ifc, g = M.geo, saida = [];
  for (const p of (m.portsOf.get(e.id) || [])) {
    const pa = m.args(p);
    if (!pa) continue;
    const mat = g.localPlacement(m.ref(pa[5]));
    const pos = applyMat(mat, [0, 0, 0]).map(x => x * g.scale);
    const fim = applyMat(mat, [0, 0, 1]).map(x => x * g.scale);
    const d = [0, 1, 2].map(k => fim[k] - pos[k]);
    const n = Math.hypot(d[0], d[1], d[2]) || 1;
    const outra = m.portLink.get(p);
    const dono = outra != null ? m.portOwner.get(outra) : null;
    saida.push({ pos, dir: d.map(x => x / n), vizinho: dono != null ? M.byId.get(dono) : null });
  }
  return saida;
}

/* cilindro de raio r e comprimento c, centrado em `centro`, no eixo `eixo` */
function cilindro(centro, eixo, r, c, lados) {
  lados = lados || 24;
  const n = Math.hypot(eixo[0], eixo[1], eixo[2]) || 1;
  const w = eixo.map(x => x / n);
  const aux = Math.abs(w[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
  const u = [w[1] * aux[2] - w[2] * aux[1], w[2] * aux[0] - w[0] * aux[2], w[0] * aux[1] - w[1] * aux[0]];
  const nu = Math.hypot(u[0], u[1], u[2]) || 1;
  const e1 = u.map(x => x / nu);
  const e2 = [w[1] * e1[2] - w[2] * e1[1], w[2] * e1[0] - w[0] * e1[2], w[0] * e1[1] - w[1] * e1[0]];
  const pos = [], idx = [];
  const ponto = (t, ang) => [0, 1, 2].map(k =>
    centro[k] + w[k] * t + r * (Math.cos(ang) * e1[k] + Math.sin(ang) * e2[k]));
  for (let i = 0; i < lados; i++) {
    const a = i / lados * Math.PI * 2;
    pos.push(...ponto(-c / 2, a), ...ponto(c / 2, a));
  }
  for (let i = 0; i < lados; i++) {           // parede
    const a = i * 2, b = ((i + 1) % lados) * 2;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const cA = pos.length / 3; pos.push(...[0, 1, 2].map(k => centro[k] - w[k] * c / 2));
  const cB = pos.length / 3; pos.push(...[0, 1, 2].map(k => centro[k] + w[k] * c / 2));
  for (let i = 0; i < lados; i++) {           // tampas
    const a = i * 2, b = ((i + 1) % lados) * 2;
    idx.push(cA, b, a, cB, a + 1, b + 1);
  }
  return { pos, idx };
}

function aplicarCorrecoes(M) {
  const c = MODELO.correcoes;
  if (!c) return;
  const porGuid = new Map(M.elements.map(e => [e.guid, e]));

  for (const t of (c.trocar || [])) {
    const e = porGuid.get(t.guid);
    if (!e) { console.warn('correção sem peça:', t.guid); continue; }
    if (t.descricao != null) e.descricao = t.descricao;
    if (t.dn) { e.dn = t.dn; e.dnPortas = []; e.dnFonte = 'correcao'; e.dnParam = ''; }
    e.corrigido = true;
  }

  const novas = [];
  for (const n of (c.criar || [])) {
    const base = porGuid.get(n.noElemento);
    if (!base) { console.warn('correção sem peça:', n.noElemento); continue; }
    const portas = portasDe(M, base).filter(p => p.vizinho && p.vizinho.dn === n.nasPortasDeDn);
    portas.forEach((p, k) => {
      const centro = [0, 1, 2].map(j => p.pos[j] + p.dir[j] * n.comprimento / 2);
      const geo = cilindro(centro, p.dir, (n.dnExterno / 1000) / 2, n.comprimento);
      novas.push({ geo, n, base, k });
    });
  }
  if (!novas.length) return;

  // estende os buffers da geometria unificada
  let nv = 0, ni = 0;
  for (const x of novas) { nv += x.geo.pos.length / 3; ni += x.geo.idx.length; }
  const pos = new Float32Array(M.positions.length + nv * 3);
  pos.set(M.positions);
  const idx = new Uint32Array(M.indices.length + ni);
  idx.set(M.indices);
  const tri = new Uint32Array(M.triElem.length + ni / 3);
  tri.set(M.triElem);
  let vo = M.positions.length / 3, io = M.indices.length, to = M.triElem.length;

  for (const x of novas) {
    const i = M.elements.length;
    const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    for (let j = 0; j < x.geo.pos.length; j++) {
      const v = x.geo.pos[j], eixo = j % 3;
      pos[vo * 3 + j] = v;
      if (v < mn[eixo]) mn[eixo] = v;
      if (v > mx[eixo]) mx[eixo] = v;
      if (v < M.bbox.min[eixo]) M.bbox.min[eixo] = v;
      if (v > M.bbox.max[eixo]) M.bbox.max[eixo] = v;
    }
    for (let j = 0; j < x.geo.idx.length; j++) idx[io + j] = x.geo.idx[j] + vo;
    for (let j = 0; j < x.geo.idx.length / 3; j++) tri[to + j] = i;
    const e = Object.assign({}, x.base, {
      i, guid: x.base.guid + '#criada' + (x.k + 1),
      categoria: 'Conexão', familia: x.n.familia, tipo: x.n.tipo,
      objType: x.n.familia + ':' + x.n.tipo, descricao: x.n.descricao,
      tag: '', marca: '', comentarios: '', hmtPa: null, vazaoLs: null,
      dn: x.n.dn, dnPortas: (x.n.dnPortas || []).slice(), dnFonte: 'correcao', dnParam: '', dnGeom: 0,
      props: {}, comprimento: 0, linear: false, eixo: null,
      sintetico: true, criado: true, parteDe: x.base.i,
      vStart: vo, iStart: io, vCount: x.geo.pos.length / 3, iCount: x.geo.idx.length,
      min: mn, max: mx
    });
    M.elements.push(e);
    vo += x.geo.pos.length / 3; io += x.geo.idx.length; to += x.geo.idx.length / 3;
  }
  M.positions = pos; M.indices = idx; M.triElem = tri;
  const uniq = (a) => [...new Set(a)];
  M.diametros = uniq(M.elements.filter(e => e.dn).map(e => e.dn)).sort((a, b) => a - b);
  M.tipos = uniq(M.elements.map(e => e.objType)).sort();
}

function montarCabecalho() {
  const M = S.model;
  $('#fileName').textContent = M.origem || '(sem nome)';
  const m = $('#meta'); m.innerHTML = '';
  const chips = [
